<style>
/* Vanerum-huisstijl: geel, zwart en wit, met lichtblauw/lila/groen als extra en de vier streepjes.
   Layout: zwarte kopbalk met logo; 3D-podium groot links, keuzepaneel rechts. Past op één 16:9-scherm; staand scherm onder elkaar. */
:root {
  --bg: #ffffff; --surface: #f4f4f2; --surface-2: #eaeae7; --ink: #1e1e1e; --muted: #5f5f5a; --line: #d6d6d1;
  --v-geel: #fbb900; --v-blauw: #b8e7f9; --v-groen: #a8cb67; --v-lila: #bda8bd; --v-zwart: #1e1e1e;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html { font-size: clamp(11px, 1.72vh, 24px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: .8rem; padding-inline: 1.2rem; padding-block: 0 .6rem; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem 2rem; background: var(--v-zwart); color: #fff; margin-inline: -1.2rem; padding: .75rem 1.2rem; min-width: 0; }
.brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.logo { height: 1.75rem; width: auto; display: block; }
.stripes { display: inline-flex; gap: .22rem; height: 1.1rem; flex: none; }
.stripes i { width: .32rem; background: var(--c); transform: skewX(-24deg); border-radius: 1px; }
.sep { width: 1px; align-self: stretch; background: rgb(255 255 255 / .25); }
h1 { font-family: var(--f-display); font-stretch: 78%; font-weight: 900; font-size: 2.1rem; line-height: 1; margin: 0; white-space: nowrap; }
h1 sup { color: var(--v-geel); font-size: .6em; }
.top small { color: #c9c9c4; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 28rem; gap: .8rem; min-height: 0; }
.stage { position: relative; background: linear-gradient(180deg, #dcf1f9 0%, #eef8fc 55%, #f7fbfc 100%); border-radius: 1.4rem; overflow: hidden; min-height: 0; }
.stage > canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--f-display); font-weight: 700; }
.hint { position: absolute; left: .9rem; bottom: .8rem; font-size: .85rem; color: var(--muted); background: rgb(255 255 255 / .85); padding: .3rem .75rem; border-radius: 99px; }
.dim { position: absolute; right: .9rem; top: .9rem; background: rgb(255 255 255 / .9); border-radius: .9rem; padding: .6rem .9rem; font-variant-numeric: tabular-nums; display: grid; gap: .1rem; }
.dim b { font-family: var(--f-display); font-stretch: 82%; font-size: 1.5rem; line-height: 1.1; }
.dim span { font-size: .8rem; color: var(--muted); }

.panel { background: var(--surface); border-radius: 1.4rem; padding: 1.2rem 1.3rem; overflow-y: auto; min-height: 0; display: grid; gap: .6rem; align-content: start; }
.panel h2 { font-family: var(--f-display); font-stretch: 82%; font-weight: 800; font-size: 1.7rem; line-height: 1.08; margin: 0; }
.panel p { margin: 0; }
.muted { color: var(--muted); font-size: .9rem; }
.group { display: grid; gap: .45rem; }
.group h3 { margin: 0; display: flex; justify-content: space-between; gap: .6rem; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.group h3 .h3r { display: flex; align-items: center; gap: .5rem; }
.flip { font: 700 .72rem/1 var(--f-body); color: var(--ink); background: #fff; border: 1.5px solid #1e1e1e; border-radius: 99px; padding: .22rem .55rem; cursor: pointer; text-transform: none; letter-spacing: 0; }
.flip[aria-pressed="true"] { background: #fbb900; }
.flip:disabled { opacity: .35; cursor: default; }
.flip:focus-visible { outline: 3px solid #fbb900; outline-offset: 2px; }
.group h3 span { text-transform: none; letter-spacing: 0; color: var(--ink); font-family: var(--f-body); font-weight: 700; font-size: .85rem; }
.shapes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem; }
.shapes button { display: grid; justify-items: center; gap: .2rem; padding: .45rem .2rem .35rem; background: var(--surface-2); border: 2px solid transparent; border-radius: .8rem; cursor: pointer; font-size: .8rem; font-weight: 700; }
.shapes svg { width: 2.6rem; height: 2rem; }
.shapes button[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); border-radius: .8rem; padding: .25rem; gap: .25rem; }
.seg button { border: 0; background: transparent; padding: .5rem .3rem; border-radius: .6rem; cursor: pointer; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.seg button:disabled { opacity: .35; cursor: default; }
.seg button[aria-pressed="true"] { background: var(--v-geel); color: var(--v-zwart); }
.swatches { display: flex; flex-wrap: wrap; gap: .35rem; }
.swatches button { width: 2.05rem; height: 2.05rem; border-radius: 50%; border: 2px solid rgb(0 0 0 / .12); background: var(--sw); cursor: pointer; padding: 0; position: relative; }
.swatches button.wood { background: repeating-linear-gradient(100deg, var(--sw) 0 3px, color-mix(in srgb, var(--sw) 82%, #5a3a1a) 3px 4px, var(--sw) 4px 8px); }
.swatches button.metal { background: linear-gradient(135deg, #e4e6e7, var(--sw) 55%, #7d8082); }
.swatches button[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.shapes button:focus-visible, .seg button:focus-visible, .swatches button:focus-visible, .btn:focus-visible { outline: 3px solid var(--v-geel); outline-offset: 2px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .9rem; margin: 0; font-size: .88rem; border-top: 1px solid var(--line); padding-top: .8rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.row { display: flex; gap: .4rem; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: transparent; padding: .4rem .8rem; border-radius: .7rem; cursor: pointer; font-weight: 700; font-size: .88rem; }
.btn:hover { background: var(--surface-2); }
footer { display: flex; justify-content: flex-end; align-items: center; gap: .6rem; font-size: .78rem; color: var(--muted); }
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  html { font-size: 15px; } body { overflow: auto; } .app { height: auto; min-height: 100%; }
  .top { flex-wrap: wrap; } .main { grid-template-columns: minmax(0, 1fr); } .stage { height: 55vh; min-height: 320px; } .panel { overflow: visible; }
}
</style>
<style>
/* Demo: één groot podium zonder knoppen; een rondleiding die zichzelf herhaalt, met een onderschrift per stap. */
.app { grid-template-rows: auto minmax(0, 1fr) auto; }
.demo { position: relative; min-height: 0; }
.demo .stage { position: absolute; inset: 0; }
.caption { position: absolute; left: 1.4rem; bottom: 1.3rem; max-width: min(34rem, 80%); background: rgb(255 255 255 / .92); border-radius: 1rem; padding: .8rem 1.1rem .9rem; display: grid; gap: .15rem; transition: opacity .5s; }
.caption small { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
.caption small i { display: inline-block; width: .32rem; height: .9rem; background: var(--v-geel); transform: skewX(-24deg); border-radius: 1px; }
.caption b { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 2.1rem; line-height: 1.05; }
.caption span { color: var(--muted); font-size: 1rem; }
.steps { position: absolute; right: 1.4rem; bottom: 1.5rem; display: flex; gap: .35rem; }
.steps i { width: .55rem; height: .55rem; border-radius: 99px; background: rgb(30 30 30 / .2); transition: background .3s, width .3s; }
.steps i.on { background: var(--v-zwart); width: 1.6rem; }
.fade { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .6s; border-radius: 1.4rem; }
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  html, body { height: 100%; overflow: hidden; }
  .app { height: 100%; min-height: 0; grid-template-rows: auto minmax(0, 1fr); padding-bottom: .5rem; }
  .top small, footer, .sep { display: none; } .logo { height: 1.2rem; } h1 { font-size: 1.35rem; }
  .demo .stage { border-radius: 1rem; height: auto; min-height: 0; }
  .caption { left: .6rem; right: .6rem; bottom: .6rem; max-width: none; padding: .6rem .8rem; } .caption b { font-size: 1.45rem; } .caption span { font-size: .85rem; }
  .steps { right: .9rem; bottom: auto; top: .8rem; }
}
@media (prefers-reduced-motion: reduce) { .caption, .fade, .steps i { transition: none; } }
</style>

// Werkhuisjes (Vanerum) – parametrisch 3D-model voor three.js 0.165.0.
// Maten uit Werkhuisjes.dwg (cm): wand 642,6 breed × 48 diep × 265,4 hoog.
//   4 kastkolommen Mobiline 2.0 van 40,5 cm (onder 178 cm met 4 deuren, erboven een open kast van 85,6 cm met 1 legplank)
//   3 nissen van 160,2 cm: zijwanden en achterwand 1,4 cm, plafond 2 cm, binnenhoogte 261,6 cm.
//   Per nis: 2 zitblokken 40 × 46 × 43 cm, een tafel 80 × 46,6 cm (hoogte 76 cm) met middenframe, een hanglamp (E27-fitting met bol).
//   Middelste nis: akoestische PET-lamellen, 32 stuks van 5 × 2,3 cm.
// Eenheden: meter. y omhoog, vloer op y = 0. De voorkant (deuren, open nissen) wijst naar +z.
// Oorsprong = midden van de wand, midden van de kastdiepte.

// Kleuren uit de DWG-materialen; de DWG bevat alleen namen, de kleurwaarden zijn geschat.
// Kleuren benaderd naar de Vanerum-afbeelding (olijf, paars, lichtblauw) en de kleurnamen uit de DWG.
// swatch: false = alleen als zitblokkleur bij een standaardnis, niet als keuze in het paneel.
const COLORS = {
  'olijf': { name: 'Olijfgroen', hex: '#5f5d2c' },
  'paars': { name: 'Paars', hex: '#6a3d8c' },
  'lichtblauw': { name: 'Lichtblauw', hex: '#6f9fc2' },
  'l05': { name: 'L05 terracotta', hex: '#94503b' },
  'midnight': { name: 'I07 Midnight Hue', hex: '#1d2641' },
  'forest': { name: 'F08 Forest Shadow', hex: '#27402f' },
  'diamantgrijs': { name: 'Diamantgrijs', hex: '#9d9e9a' },
  'soft-cloud': { name: 'M00 Soft Cloud', hex: '#ecebe6' },
  'lila-zit': { name: 'Lila', hex: '#b48fd0', swatch: false },
  'blauw-zit': { name: 'Blauw', hex: '#3f86b8', swatch: false },
};
const DECORS = {
  'acacia': { name: 'Acacia H1277', hex: '#a98a66', wood: true },
  'beuk': { name: 'Lichte beuk H1518', hex: '#e2c39a', wood: true },
  'eik': { name: 'Eik reliëf H1180', hex: '#b88f62', wood: true },
  'esdoorn': { name: 'Esdoorn H1867', hex: '#ead9b8', wood: true },
  'wit': { name: 'Wit W1000', hex: '#f3f3f0' },
  'zilvergrijs': { name: 'Zilver-grijs U765', hex: '#b7b7b3' },
  'grafiet': { name: 'Grafiet-zwart U961', hex: '#3a3b3d' },
};
const BACKS = { effen: 'Effen paneel', lamellen: 'Akoestische lamellen' };
// Standaard: alle nissen terracotta (op verzoek), achterwanden als in de DWG (effen / lamellen / effen)
const DEFAULT_NICHES = [
  { color: 'olijf', back: 'effen', backColor: 'olijf' },
  { color: 'paars', back: 'lamellen', backColor: 'paars', seat: 'lila-zit' },
  { color: 'lichtblauw', back: 'effen', backColor: 'lichtblauw', seat: 'blauw-zit' },
];
const DOOR_OPEN = 1.75;   // openingshoek in radialen (ca. 100°)
// deur open of dicht zetten (animatie via stepDoors)
function setDoor(pivot, open, instant = false) { pivot.userData.target = open ? DOOR_OPEN : 0; if (instant) { pivot.userData.angle = pivot.userData.target; pivot.rotation.y = pivot.userData.dir * pivot.userData.angle; } }
// één animatiestap; geeft true terug zolang er nog een deur beweegt
function stepDoors(doors, dt) {
  let moving = false;
  for (const p of doors) { const u = p.userData, d = u.target - u.angle; if (Math.abs(d) < 1e-3) { if (u.angle !== u.target) { u.angle = u.target; p.rotation.y = u.dir * u.angle; moving = true; } continue; }
    u.angle += Math.sign(d) * Math.min(Math.abs(d), dt * 3.2); p.rotation.y = u.dir * u.angle; moving = true; }
  return moving;
}
const DIM = { colW: .405, nicheW: 1.602, depth: .48, cabH: 1.78, topH: 2.636, coverH: .018, height: 2.654 };

// ---------- hulpfuncties ----------
function woodTexture(hex, vertical = true) {
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512; const g = cv.getContext('2d');
  g.fillStyle = hex; g.fillRect(0, 0, 1024, 512);
  const base = new THREE.Color(hex); let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 170; i++) {
    const y0 = rnd() * 512, amp = 2 + rnd() * 6, f = .004 + rnd() * .01, dark = rnd() < .6;
    const c = base.clone().offsetHSL(0, 0, dark ? -.05 - rnd() * .06 : .03 + rnd() * .03);
    g.strokeStyle = `#${c.getHexString()}`; g.globalAlpha = .25 + rnd() * .35; g.lineWidth = .6 + rnd() * 2.2;
    g.beginPath(); for (let x = 0; x <= 1024; x += 16) { const y = y0 + Math.sin(x * f + i) * amp; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (vertical) { t.rotation = Math.PI / 2; } t.repeat.set(1.2, 1.2); t.anisotropy = 4; return t;
}
// Doos met de onderkant op y0; x0..x1, y0..y1, z0..z1 in meter
function box(x0, x1, y0, y1, z0, z1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0); g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); return g;
}
// box-uv per vlak schalen naar ware grootte (houtnerf blijft overal even groot)
function worldUV(g, scale = 1) {
  const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i));
    const [u, v] = ax > .5 ? [p.getZ(i), p.getY(i)] : ay > .5 ? [p.getX(i), p.getZ(i)] : [p.getX(i), p.getY(i)];
    uv.setXY(i, u * scale, v * scale);
  }
  return g;
}
const Z = y => (24 - y) / 100;          // DWG-diepte (cm, 0 = voorkant korpus) → wereld-z (m)

// ---------- onderdelen ----------
function cabinetColumn(x0, mats, add) {
  // onderkast 0–178 cm (korpus), 4 deuren, open kast 178–263,6 cm (wit)
  const w = DIM.colW, s = .019, d0 = Z(0), d1 = Z(48), dIn = Z(46.1);
  const g = [];
  g.push(box(x0, x0 + s, 0, 1.78, dIn, d0), box(x0 + w - s, x0 + w, 0, 1.78, dIn, d0));            // zijkanten
  g.push(box(x0 + .001, x0 + w - .001, .097, 1.78, d1, dIn));                                         // achterwand
  g.push(box(x0 + s, x0 + w - s, .097, .116, dIn, d0));                                               // bodem
  g.push(box(x0 + s, x0 + w - s, 0, .097, Z(2.1), Z(.2)));                                            // plint voor
  add(mergeGeometries(g.map(x => worldUV(x, 1.4))), mats.corpus, 'kast-korpus');
  const sh = [.513, .929, 1.345, 1.761].map(y => box(x0 + s, x0 + w - s, y, y + .019, dIn, d0 - .002));
  add(mergeGeometries(sh.map(x => worldUV(x, 1.4))), mats.corpus, 'kast-legplanken');
  add(box(x0 + s, x0 + w - s, 0, .097, d1 + .019, Z(44)), mats.corpus, 'plint-achter');
  // open kast erboven (wit): zijkanten, rug, bodem, legplank, bovenblad
  const o = [box(x0, x0 + s, 1.78, 2.636, dIn, d0), box(x0 + w - s, x0 + w, 1.78, 2.636, dIn, d0), box(x0 + .001, x0 + w - .001, 1.78, 2.636, d1, dIn)];
  for (const y of [1.78, 2.198, 2.617]) o.push(box(x0 + s, x0 + w - s, y, y + .019, dIn, d0));
  add(mergeGeometries(o.map(x => worldUV(x, 1.4))), mats.corpus, 'open-kast');
  // deuren (1,9 cm) met verticale greep; elke deur draait om een eigen scharnier aan de kant tegenover de greep
  const doorsY = [.1196, .5346, .9536, 1.3686], dw = .393, dh = .401;
  const handleRight = mats.handleSide > 0, zb = Z(-.6), zf = Z(-2.5);
  doorsY.forEach((y, k) => {
    const hingeX = handleRight ? x0 + .011 : x0 + .011 + dw;
    const pivot = new THREE.Group(); pivot.name = `deur-${mats.col + 1}-${k + 1}`; pivot.position.set(hingeX, 0, zb);
    const door = new THREE.Mesh(worldUV(box(x0 + .011 - hingeX, x0 + .011 + dw - hingeX, y, y + dh, 0, zf - zb + .0001), 1.4), mats.door);
    door.name = 'deur'; door.castShadow = door.receiveShadow = true; pivot.add(door);
    const hx = (handleRight ? x0 + .345 : x0 + .06) - hingeX, d = zf - zb;
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(hx, y + .047, d), new THREE.Vector3(hx, y + .1215, d + .056), new THREE.Vector3(hx, y + .196, d));
    const grip = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, .005, 8, false), mats.handle); grip.name = 'greep'; grip.castShadow = true; pivot.add(grip);
    // openen = naar voren draaien: scharnier links → negatieve hoek, scharnier rechts → positieve hoek
    pivot.userData = { door: true, key: `${mats.col}:${k}`, dir: handleRight ? -1 : 1, angle: 0, target: 0 };
    mats.parent.add(pivot); mats.doors.push(pivot);
  });
}

function lamellaGeo(x0, width) {
  // halfronde lamellen van 5 cm breed en 2,3 cm diep tegen de achterwand
  const n = Math.round(width / .05), pitch = width / n, r = pitch / 2, dz = .023;
  const sh = new THREE.Shape(); sh.moveTo(-r, 0);
  for (let i = 0; i <= 16; i++) { const a = Math.PI - Math.PI * i / 16; sh.lineTo(Math.cos(a) * r, Math.sin(a) * dz); }
  sh.lineTo(-r, 0);
  const base = new THREE.ExtrudeGeometry(sh, { depth: 2.616, bevelEnabled: false, curveSegments: 4 });
  base.rotateX(-Math.PI / 2);                 // extrusie langs +y, profiel in x/−z
  base.scale(1, 1, -1);                       // bolle kant naar voren (+z)
  const gs = [];
  for (let i = 0; i < n; i++) { const g = base.clone(); g.translate(x0 + r + i * pitch, 0, Z(47.7)); gs.push(g); }
  const m = mergeGeometries(gs); m.computeVertexNormals(); return m;
}

function niche(x0, cfg, opts, mats, add, idx) {
  const W = DIM.nicheW, x1 = x0 + W, t = .014, dIn = Z(46.1), d0 = Z(0);
  const col = mats.color(cfg.color), back = mats.color(cfg.backColor, true);
  const tag = `nis-${idx + 1}`;
  add(mergeGeometries([box(x0, x0 + t, 0, 2.616, dIn, d0), box(x1 - t, x1, 0, 2.616, dIn, d0)]), col, `${tag}-zijwanden`);
  add(box(x0, x1, 2.616, 2.636, dIn, d0), col, `${tag}-plafond`);
  if (cfg.back === 'lamellen') {
    add(box(x0 + t, x1 - t, 0, 2.616, Z(48), Z(47.7)), back, `${tag}-achterwand`);
    add(lamellaGeo(x0 + t, W - 2 * t), back, `${tag}-lamellen`);
  } else add(box(x0 + t, x1 - t, 0, 2.616, Z(48), Z(46.6)), back, `${tag}-achterwand`);
  const cx = (x0 + x1) / 2;
  if (opts.seats) {
    for (const [a, n] of [[x0 + t, 'links'], [x1 - t - .40, 'rechts']]) {
      const g = box(a, a + .40, .02, .45, dIn, d0); const m = add(g, cfg.seat ? mats.color(cfg.seat) : col, `${tag}-zitblok-${n}`);
      add(mergeGeometries([0, 1].map(k => box(a + .03 + k * .3, a + .07 + k * .3, 0, .02, dIn + .03, d0 - .03))), mats.glide, `${tag}-glijders-${n}`);
    }
  }
  if (opts.tables) {
    const zb = Z(46.6), zf = Z(0);
    add(box(cx - .40, cx + .40, .74, .76, zb, zf), mats.tableTop, `${tag}-tafelblad`);
    const fx0 = cx - .024, fx1 = cx + .024;
    add(mergeGeometries([box(fx0, fx1, 0, .74, Z(2.4), zf), box(fx0, fx1, 0, .74, zb, Z(44.2)),
      box(cx - .0135, cx + .0135, .71, .74, Z(44.2), Z(2.4)), box(cx - .0135, cx + .0135, .157, .187, Z(44.2), Z(2.4))]), mats.tableFrame, `${tag}-tafelframe`);
  }
  if (opts.lamps) {
    const lz = Z(25);
    const cord = new THREE.CylinderGeometry(.003, .003, 2.616 - 1.645, 8); cord.translate(cx, (2.616 + 1.645) / 2, lz);
    add(cord, mats.cord, `${tag}-snoer`);
    const sock = new THREE.LatheGeometry([[0, 0], [.02, 0], [.022, .006], [.022, .09], [.012, .095], [0, .095]].map(([r, y]) => new THREE.Vector2(r, y)), 24);
    sock.translate(cx, 1.55, lz); add(sock, col, `${tag}-fitting`);
    const bulb = new THREE.SphereGeometry(.0625, 32, 20); bulb.translate(cx, 1.465, lz);
    const bm = add(bulb, mats.bulb, `${tag}-lamp`); bm.castShadow = false;
    const neck = new THREE.CylinderGeometry(.013, .02, .03, 16); neck.translate(cx, 1.535, lz); add(neck, mats.bulb, `${tag}-lamphals`);
  }
}

// ---------- het model ----------
// opts: { niches: [{color, back, backColor} ×3], corpus: decor, door: decor, tables, seats, lamps, deco: bool }
function buildWerkhuisjes(o = {}) {
  const opts = { niches: DEFAULT_NICHES, corpus: 'acacia', door: 'acacia', tables: true, seats: true, lamps: true, deco: true, contents: true, ...o };
  const nN = opts.niches.length, total = (nN + 1) * DIM.colW + nN * DIM.nicheW, xs = -total / 2;
  const root = new THREE.Group(); root.name = `Werkhuisjes ${nN} nissen`;
  const cache = new Map();
  const std = (key, make) => { if (!cache.has(key)) cache.set(key, make()); return cache.get(key); };
  const decorMat = (k, name) => std('d' + k + name, () => { const D = DECORS[k] || DECORS.acacia;
    return new THREE.MeshStandardMaterial({ color: D.wood ? '#ffffff' : D.hex, map: D.wood ? woodTexture(D.hex) : null, roughness: .6, name }); });
  const mats = {
    corpus: decorMat(opts.corpus, 'korpus'), door: decorMat(opts.door, 'deuren'),
    inner: std('inner', () => new THREE.MeshStandardMaterial({ color: '#efeee9', roughness: .6, name: 'wit-M00' })),
    handle: std('handle', () => new THREE.MeshStandardMaterial({ color: '#4a4b4d', roughness: .4, metalness: .3, name: 'greep' })),
    glide: std('glide', () => new THREE.MeshStandardMaterial({ color: '#1d1e1f', roughness: .8, name: 'glijder' })),
    tableTop: std('tt', () => new THREE.MeshStandardMaterial({ color: '#f1f0ec', roughness: .5, name: 'tafelblad' })),
    tableFrame: std('tf', () => new THREE.MeshStandardMaterial({ color: '#1b1c1d', roughness: .45, metalness: .2, name: 'tafelframe' })),
    cord: std('cord', () => new THREE.MeshStandardMaterial({ color: '#2a2a2a', roughness: .7, name: 'snoer' })),
    bulb: std('bulb', () => new THREE.MeshStandardMaterial({ color: '#fff4dc', emissive: '#ffd79a', emissiveIntensity: .9, roughness: .15, name: 'lamp' })),
    color: (k, felt) => std('c' + k + !!felt, () => new THREE.MeshStandardMaterial({ color: (COLORS[k] || COLORS['soft-cloud']).hex, roughness: felt ? .95 : .7, name: (COLORS[k] || {}).name || k })),
  };
  const add = (geo, mat, name) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.castShadow = true; m.receiveShadow = true; root.add(m); return m; };
  const columns = [], doors = [];
  for (let c = 0; c <= nN; c++) {
    const x0 = xs + c * (DIM.colW + DIM.nicheW);
    cabinetColumn(x0, { ...mats, handleSide: c < (nN + 1) / 2 ? 1 : -1, col: c, parent: root, doors }, add); columns.push(x0);
  }
  opts.niches.forEach((cfg, i) => niche(xs + DIM.colW + i * (DIM.colW + DIM.nicheW), cfg, opts, mats, add, i));
  add(worldUV(box(xs, xs + total, 2.636, 2.654, Z(48), Z(0)), 1.4), mats.corpus, 'afdekblad');
  if (opts.deco) {
    // witte pot (ø 10 cm) op de onderste plank van de tweede open kast, zoals in de DWG; met een eenvoudige plant (toegevoegd)
    const x = columns[1] + .2, z = Z(14.7);
    const pot = new THREE.LatheGeometry([[0, 0], [.04, 0], [.05, .005], [.05, .114], [.046, .114], [0, .108]].map(([r, y]) => new THREE.Vector2(r, y)), 28);
    pot.translate(x, 1.799, z); add(pot, mats.inner, 'decoratie-pot');
    const leafMat = std('leaf', () => new THREE.MeshStandardMaterial({ color: '#4f7a45', roughness: .7, side: THREE.DoubleSide, name: 'plant' }));
    const lg = [];
    for (let k = 0; k < 9; k++) {
      const a = k * 2.4, len = .1 + (k % 3) * .03, lf = new THREE.CircleGeometry(1, 12); lf.scale(.022, len / 2, 1);
      lf.translate(0, len / 2, 0); lf.rotateX(-.35 - (k % 3) * .2); lf.rotateY(a); lf.translate(x, 1.905, z); lg.push(lf);

  }
  if (opts.contents) fillCabinets(root, columns);
  root.userData = { doors, columns, total, height: DIM.height, depth: DIM.depth, niches: nN, nicheX: opts.niches.map((_, i) => xs + DIM.colW + i * (DIM.colW + DIM.nicheW) + DIM.nicheW / 2) };
  return root;
}

// ---------- kastinhoud: boeken, ordners en stapels schriften, zoals in een lerarenlocker ----------
// Vakken onderkast: 4 vakken van 36,7 × 39,7 cm, diepte ca. 44 cm. Open kast: 2 vakken.
const STUFF_COLORS = ['#2f5d9e', '#c0392b', '#1e1e1e', '#f1c40f', '#3f8f4a', '#e67e22', '#7d4fb3', '#16a3b8', '#e8e3d6'];
function fillCabinets(root, columns, seed = 7) {
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, pick = a => a[Math.floor(rnd() * a.length)];
  const byColor = new Map(), put = (hex, g) => { if (!byColor.has(hex)) byColor.set(hex, []); byColor.get(hex).push(g.index ? g.toNonIndexed() : g); };
  const B = (hex, w, h, d, x, y, z, ry = 0, rz = 0) => { const g = new THREE.BoxGeometry(w, h, d); g.rotateZ(rz); g.rotateY(ry); g.translate(x, y + h / 2, z); put(hex, g); };
  const zBack = Z(46.1), zFront = Z(0) - .01, zMid = (zBack + zFront) / 2;
  const binders = (x0, x1, y) => { let x = x0 + .01; const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n && x + .08 < x1; i++) { const c = pick(STUFF_COLORS.slice(0, 8)); B(c, .075, .285, .29, x + .0375, y, zBack + .17);
      B('#f4f2ec', .05, .09, .002, x + .0375, y + .17, zBack + .315); x += .078; }
    if (x + .06 < x1 && rnd() < .7) B(pick(STUFF_COLORS), .075, .285, .29, x + .06, y, zBack + .17, 0, -.28); };
  const books = (x0, x1, y, maxH = .3) => { let x = x0 + .01;
    while (x < x1 - .05) { const w = .018 + rnd() * .03, h = Math.min(maxH, .18 + rnd() * .12), d = .14 + rnd() * .08;
      B(pick(STUFF_COLORS), w, h, d, x + w / 2, y, zBack + d / 2 + .03); x += w + .002; if (rnd() < .12) { x += .05; } }
  };
  const notebooks = (x0, x1, y) => {   // twee stapels schriften en mappen
    for (const [cx, n] of [[x0 + .1, 7], [x1 - .1, 5]]) { let yy = y;
      for (let i = 0; i < n; i++) { const t = .008 + rnd() * .014, w = .16 + rnd() * .03, d = .22 + rnd() * .05; B(pick(STUFF_COLORS), w, t, d, cx + (rnd() - .5) * .015, yy, zMid + (rnd() - .5) * .02, (rnd() - .5) * .12); yy += t; } }
  };
  const fills = [binders, books, notebooks];
  columns.forEach((x0, c) => {
    const xi0 = x0 + .019, xi1 = x0 + DIM.colW - .019;
    [.116, .532, .948, 1.364].forEach((y, k) => {
      const f = fills[(c * 2 + k * 3 + (c === 1 ? 1 : 0)) % fills.length];
      f(xi0, xi1, y);
    });
    // open kast: boeken op de onderste plank, af en toe een ordner of plant
    if (c !== 1) books(xi0, xi1 - (c % 2 ? .12 : 0), 1.799, .26);
    if (c === 3 || c === 0) binders(xi0, xi1, 2.217);
  });
  const g = new THREE.Group(); g.name = 'kastinhoud';
  for (const [hex, gs] of byColor) {
    const m = new THREE.Mesh(mergeGeometries(gs), new THREE.MeshStandardMaterial({ color: hex, roughness: .6, name: 'inhoud' })); m.castShadow = m.receiveShadow = true; m.name = 'kastinhoud'; g.add(m);
  }
  root.add(g); return g;
}

// Poppetjes (2D) voor de werkhuisjes-demo – de originele illustraties als uitsnede in de 3D-scène.
// Elk poppetje is een vlak dat om de verticale as naar de kijker draait. Een zachte gloed in de eigen kleur wordt bij het laden getekend.
// FIG_DATA (data-URI's) wordt bij het bouwen ingevoegd.

// h = hoogte van het hele figuur (m); ax = horizontale plek van de heup/het midden (0 = links, 1 = rechts in het plaatje)
const FIGS = {
  lila_zit: { h: 1.40, ax: .36, color: '#9b5de5', name: 'Lila zittend' },
  geel_zit: { h: 1.36, ax: .5, color: '#f5b700', name: 'Geel zittend' },
  groen_zit: { h: 1.38, ax: .66, color: '#7dc242', name: 'Groen zittend' },
  lila_loop: { h: 1.70, ax: .48, color: '#9b5de5', name: 'Lila lopend' },
  geel_loop: { h: 1.82, ax: .5, color: '#f5b700', name: 'Geel lopend' },
  groen_loop: { h: 1.76, ax: .5, color: '#7dc242', name: 'Groen lopend' },

const ACTIVITIES = { leeg: 'Leeg', overleg: 'Overleg', zitten: 'Even zitten' };
const FRONT = { leeg: 'Leeg', lopen: 'Lopen' };

const PAD = .14;   // ruimte rond het figuur voor de gloed (deel van de hoogte)
const texCache = new Map();
function figTexture(key, glow, onReady) {

    g.drawImage(img, p, p);

}
let shadowTex = null;

    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); shadowTex = new THREE.CanvasTexture(cv);
  }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * .35).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  m.position.y = .002; m.name = 'schaduw'; return m;
}
// één poppetje: groep op (x, z) met een vlak dat naar de camera draait
function figure(key, x, z, glow, onReady, billboard = false) {
  const F = FIGS[key], g = new THREE.Group(); g.name = F.name; g.position.set(x, 0, z);
  // eerst het vlak maken, dan pas de textuur koppelen (een al geladen textuur roept de callback direct aan)
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(.01, .01), new THREE.MeshBasicMaterial({ transparent: true, alphaTest: .02, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
  plane.name = 'figuur'; plane.visible = false; plane.renderOrder = 2; g.add(plane);
  const tex = figTexture(key, glow, () => {
    const cv = tex.image, ch = cv.height / (1 + 2 * PAD), sc = F.h / ch, w = cv.width * sc, h = cv.height * sc, pad = (cv.height - ch) / 2 * sc;
    const geo = new THREE.PlaneGeometry(w, h); geo.translate(-(pad + F.ax * (w - 2 * pad)) + w / 2, h / 2 - pad, 0);
    plane.geometry.dispose(); plane.geometry = geo; plane.material.map = tex; plane.material.needsUpdate = true; plane.visible = true; onReady();
  });

  return g;
}

// wall.userData.nicheX = middens van de nissen
function populate2D(wall, cfg, onReady = () => {}) {
  const g = new THREE.Group(); g.name = 'poppetjes';
  const X = wall.userData.nicheX, glow = cfg.glow !== false, zc = .01;
  const add = (k, x, z, shadow, bb = false) => { const f = figure(k, x, z, glow, onReady, bb); if (shadow) f.add(blobShadow(.7)); g.add(f); return f; };
  const ZF = .31;   // net vóór zitblokken (24 cm) en deurgrepen (30 cm)
  cfg.niches.forEach((act, i) => {
    const cx = X[i];
    if (act === 'overleg') { add('lila_zit', cx - .48, ZF); add('groen_zit', cx + .56, ZF); }
    if (act === 'zitten') add('geel_zit', cx - .59, ZF);
  });
  if (cfg.front === 'lopen') {
    // bij de kastkolommen, zodat de nissen zichtbaar blijven
    const col = (X[1] - X[0]) / 2;
    add('lila_loop', X[0] - col - .1, 1.05, true, true);
    add('geel_loop', X[1] + col, 1.05, true, true);
    add('groen_loop', X[2] + col + .1, 1.05, true, true);

}
// laat alle poppetjes naar de camera kijken (alleen draaien om de verticale as)
function faceCamera(group, camera) {
  group?.children.forEach(c => { if (c.userData.billboard) c.rotation.y = Math.atan2(camera.position.x - c.position.x, camera.position.z - c.position.z); });
}



const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement); renderer.domElement.style.display = 'block'; renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8c88, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2.4, 5.5, 4.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -4.5, right: 4.5, top: 4, bottom: -4, near: .5, far: 14 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.2 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
function fitDist(w, h) { const v = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2); return Math.max((h / 2) / v, (w / 2) / (v * camera.aspect)) + .6; }
function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

// ---------- de wand ----------
const START = DEFAULT_NICHES.map(n => ({ ...n }));
const wall = buildWerkhuisjes({ niches: START, contents: true }); scene.add(wall);
const X = wall.userData.nicheX, cols = wall.userData.columns;
// ---------- poppetjes ----------
const people = new THREE.Group(); scene.add(people);
const fig = (key, x, z, shadow, bb = false) => { const f = figure(key, x, z, true, () => {}, bb); if (shadow) f.add(blobShadow(.7)); f.userData.op = 0; f.userData.to = 0; people.add(f); setOp(f, 0); return f; };
function setOp(f, a) { f.userData.op = a; f.visible = a > .01; f.traverse(o => { if (o.material) { o.material.opacity = a * (o.name === 'schaduw' ? 1 : 1); o.material.transparent = true; } }); }
const ZF = .31;
const P = {
  groen: fig('groen_zit', X[2] + .56, ZF), lila: fig('lila_zit', X[2] - .48, ZF), geel: fig('geel_zit', X[0] - .59, ZF),
  wLila: fig('lila_loop', 0, 1.1, true, true), wGeel: fig('geel_loop', 0, 0, true, true), wGroen: fig('groen_loop', 0, 0, true, true),
};
const fading = [...Object.values(P)];

// ---------- deuren ----------
const doors = wall.userData.doors;
const doorsOf = c => doors.filter(d => d.userData.key.startsWith(c + ':'));
let doorQueue = [];   // [tijdstip, deur, open]

// ---------- rondleiding ----------
// cam: [doel x, y, z, richting x, y, z, breedte, hoogte, minimale afstand]
const STEPS = [
  { t: 6, title: 'Werkhuisjes', text: 'Drie rustige werkplekken in één kastenwand van 6,4 meter.', cam: [0, 1.2, .3, .12, .14, 1, 7.4, 3.1, 9] },
  { t: 9, title: 'Gewoon langslopen', text: 'De wand staat in de gang of het leerplein: open, maar toch beschut.', cam: [0, 1.0, .9, .1, .12, 1, 7.6, 3.0, 9.5], walk: true },
  { t: 6, title: 'Even rustig zitten', text: 'Eén leerling of collega trekt zich terug in een nis.', cam: [X[2], 1.05, .15, -.28, .2, 1, 2.4, 2.7, 4.6], on: ['groen'] },
  { t: 6, title: 'Samen overleggen', text: 'Twee zitblokken en een tafel: genoeg voor een kort gesprek.', cam: [X[2], 1.05, .15, -.2, .16, 1, 2.4, 2.7, 4.6], on: ['groen', 'lila'] },
  { t: 6, title: 'Een eigen plek', text: 'Even zitten, lezen of nadenken, zonder de klas uit te hoeven.', cam: [X[0], 1.0, .2, .3, .14, 1, 2.4, 2.7, 4.6], on: ['geel'] },
  { t: 12, title: 'Alles netjes opgeborgen', text: 'Boeken, ordners en stapels schriften: elke kolom heeft vier afsluitbare vakken.', cam: [cols[1] + DIM.colW / 2, 1.0, .1, .42, .12, 1, 1.7, 2.1, 3.4], doors: [1] },
];
$('steps').innerHTML = STEPS.map(() => '<i></i>').join('');
function camFor(c) { const tgt = new THREE.Vector3(c[0], c[1], c[2]), dir = new THREE.Vector3(c[3], c[4], c[5]).normalize(); return { pos: tgt.clone().addScaledVector(dir, Math.max(c[8], fitDist(c[6], c[7]))), tgt }; }
let step = -1, stepT0 = 0, camFrom = null, camTo = null, camT0 = 0;
const look = new THREE.Vector3();
function enterStep(i, now) {
  step = i; stepT0 = now; const S = STEPS[i];
  const cap = $('caption'); cap.style.opacity = 0;
  setTimeout(() => { $('capStep').textContent = `${i + 1} van ${STEPS.length}`; $('capTitle').textContent = S.title; $('capText').textContent = S.text; cap.style.opacity = 1; }, reduce ? 0 : 450);
  [...$('steps').children].forEach((d, k) => d.classList.toggle('on', k === i));
  const on = new Set(S.on || []);
  P.groen.userData.to = on.has('groen') ? 1 : 0; P.lila.userData.to = on.has('lila') ? 1 : 0; P.geel.userData.to = on.has('geel') ? 1 : 0;
  for (const w of [P.wLila, P.wGeel, P.wGroen]) w.userData.to = S.walk ? 1 : 0;
  // deuren: in de kaststap één voor één open, daarna weer dicht
  doorQueue = [];
  if (S.doors) S.doors.forEach((c, ci) => doorsOf(c).forEach((d, k) => { doorQueue.push([now + 700 + (ci * 4 + k) * 300, d, true]); doorQueue.push([now + S.t * 1000 - 1900 + k * 120, d, false]); }));
  else doors.forEach(d => setDoor(d, false));
  camFrom = { pos: camera.position.clone(), tgt: look.clone() }; camTo = camFor(S.cam); camT0 = now;
  if (i === 0) camFrom = camFor(S.cam);
}
let started = false, last = 0;
function loop(now) {
  if (!started) { started = true; camTo = camFor(STEPS[0].cam); camera.position.copy(camTo.pos); look.copy(camTo.tgt); enterStep(0, now); last = now; }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const S = STEPS[step], el = (now - stepT0) / 1000;
  if (el > S.t && !window.__hold) {
    if (step === STEPS.length - 1) {   // terug naar het begin: alles resetten achter de witte overgang
      fading.forEach(f => setOp(f, 0)); for (const w of [P.wLila, P.wGeel, P.wGroen]) setOp(w, 0);
      setTimeout(() => { $('fade').style.opacity = 0; }, reduce ? 0 : 150);
    }
    enterStep((step + 1) % STEPS.length, now);
  }
  { const cur = STEPS[step], ce = (now - stepT0) / 1000;   // na een stapwissel opnieuw rekenen met de nieuwe stap
    if (step === STEPS.length - 1 && ce > cur.t - .75 && !window.__hold) $('fade').style.opacity = 1; }
  // camera
  const k = reduce ? 1 : Math.min(1, (now - camT0) / 2200), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const to = camFor(S.cam);   // opnieuw berekend: past zich aan als het scherm draait
  camera.position.lerpVectors(camFrom.pos, to.pos, e); look.lerpVectors(camFrom.tgt, to.tgt, e);
  if (!reduce) camera.position.x += Math.sin(now / 4000) * .06 * k;   // heel licht bewegen, zodat het beeld leeft
  camera.lookAt(look);

  // lopers: lila loopt van links naar rechts, geel komt naar voren, groen loopt naar de wand toe
  const wk = Math.min(1, el / S.t);
  if (S.walk) {
    P.wLila.position.set(-3.6 + wk * 5.2, 0, 1.25);
    P.wGeel.position.set(1.25, 0, .95 + wk * 1.4);
    P.wGroen.position.set(2.9, 0, 3.0 - wk * 1.6);
    for (const w of [P.wLila, P.wGeel, P.wGroen]) { const u = w.userData; const fadeOut = el > S.t - 1.2; const tgt = fadeOut ? 0 : 1; if (u.op !== tgt) setOp(w, THREE.MathUtils.clamp(u.op + Math.sign(tgt - u.op) * dt * 1.8, 0, 1)); }
  } else for (const w of [P.wLila, P.wGeel, P.wGroen]) if (w.userData.op > 0) setOp(w, Math.max(0, w.userData.op - dt * 2));
  faceCamera(people, camera);
  // deuren
  doorQueue = doorQueue.filter(([t, d, open]) => { if (now >= t) { setDoor(d, open); return false; } return true; });
  stepDoors(doors, reduce ? 10 : dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
$('loading').remove();
requestAnimationFrame(loop);
window.__ready = true;
window.__goto = i => { enterStep(i, performance.now() - 0); camFrom = camFor(STEPS[i].cam); };
</script>
