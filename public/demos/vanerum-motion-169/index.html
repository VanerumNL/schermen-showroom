/* Layout: one 9:16 stage, centred, letterboxed on a dark ground. Single dark look on purpose (brand colours). */
:root{
  --ground:#0E0E0D;
  --stage:#141413;
  --ink:#F2EFF2;
  --yellow:#FBBA00;
  --muted:#8C8A86;
  --display:"Syncopate","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box;overflow:hidden}
.stage{position:relative;aspect-ratio:16/9;width:min(100%,calc((100vh - 32px)*16/9));max-height:100%;background:var(--stage);overflow:hidden;container-type:size;border-radius:10px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.band{position:absolute;top:-12%;bottom:-12%;left:0;width:260%;opacity:0;
  background:linear-gradient(90deg,var(--yellow) 0 2.2%,var(--stage) 2.2% 2.9%,var(--yellow) 2.9% 3.6%,var(--stage) 3.6% 96.4%,var(--yellow) 96.4% 97.1%,var(--stage) 97.1% 97.8%,var(--yellow) 97.8% 100%);
  pointer-events:none;z-index:3}
.cap{position:absolute;left:6cqh;right:6cqh;top:7cqh;z-index:2;visibility:hidden;display:grid;gap:2.2cqh}
.line{overflow:hidden;padding-bottom:.08em}
.line>span{display:block}
.eyebrow{font:700 4cqh/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
.title{font:700 10cqh/1.05 var(--display);text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.scrim{position:absolute;inset:0 0 auto;height:34cqh;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(20,20,19,.92) 0,rgba(20,20,19,.6) 55%,rgba(20,20,19,0))}
.url{position:absolute;left:0;right:0;top:61cqh;text-align:center;z-index:2;font:700 4cqh/1 var(--body);letter-spacing:.32em;color:var(--ink);opacity:.7;visibility:hidden}
.progress{position:absolute;left:0;bottom:0;height:.6cqh;min-height:2px;width:100%;background:var(--yellow);transform-origin:0 50%;transform:scaleX(0);z-index:4;opacity:.9}
.cover{position:absolute;inset:0;z-index:5;display:grid;place-items:center;align-content:end;padding-bottom:16cqh;gap:3cqh;background:linear-gradient(180deg,transparent 45%,rgba(14,14,13,.85))}
.play{display:inline-flex;align-items:center;gap:3cqh;border:0;border-radius:999px;background:var(--yellow);color:var(--stage);
  font:700 max(14px,3.8cqh)/1 var(--body);padding:3.6cqh 6.5cqh 3.6cqh 5.2cqh;cursor:pointer}
.play svg{width:max(14px,3.6cqh);height:max(14px,3.6cqh)}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.hint{font:500 max(12px,2.9cqh)/1.3 var(--body);color:var(--muted)}
</style>

const M = {
  y: new THREE.MeshStandardMaterial({color:C.y, roughness:.42}),

  w: new THREE.MeshStandardMaterial({color:C.w, roughness:.55})

function box(w,h,d,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; return m;
}
function desk(){
  const g = new THREE.Group(), parts = [];
  [[-.56,-.28],[.56,-.28],[-.56,.28],[.56,.28]].forEach(([x,z])=>parts.push(box(.04,.72,.04,M.k,x,.36,z)));
  parts.push(box(1.16,.03,.04,M.k,0,.70,-.28));
  parts.push(box(1.22,.04,.66,M.w,0,.74,0));
  parts.forEach(p=>g.add(p)); return {g, parts};
}
function chair(){
  const g = new THREE.Group(), parts = [];
  [[-.18,-.17],[.18,-.17],[-.18,.17],[.18,.17]].forEach(([x,z])=>parts.push(box(.03,.44,.03,M.k,x,.22,z)));

}

  const n = Math.floor(Math.max(0, Math.min(1, (p-.15)/.6))*80);
  sx.lineWidth = 14; sx.lineCap = sx.lineJoin = 'round'; sx.strokeStyle = '#FBBA00';
  if(n>1){ sx.beginPath(); sx.moveTo(...pts[0]); for(let i=1;i<=n;i++) sx.lineTo(...pts[i]); sx.stroke(); }
  if(n>0 && p<.9){ const [x,y] = pts[n]; const r = 18 + (p*900)%30;
    sx.strokeStyle = 'rgba(242,239,242,.85)'; sx.lineWidth = 4; sx.beginPath(); sx.arc(x,y,r,0,7); sx.stroke(); }
  const ta = Math.max(0, Math.min(1, (p-.62)/.2));
  sx.globalAlpha = ta; sx.fillStyle = '#F2EFF2'; sx.font = '700 64px Manrope, system-ui, sans-serif';
  sx.fillText('3 × 4 = 12', 80, 500 - (1-ta)*16); sx.globalAlpha = 1;
  scrTex.needsUpdate = true;
}

/* scene 4: motion cubes */
const S4 = sceneGroup(), cubes = [];
const cubeSpots = [[-.5,.225],[0,.225],[.5,.225],[-.25,.675],[.25,.675],[0,1.125]];
const cubeMats = [M.y, M.w, M.k, M.w, M.y, M.y];
cubeSpots.forEach(([x,y],i)=>{ const c = box(.44,.44,.44,cubeMats[i],x,y,0); S4.add(c); cubes.push(c); });

/* scene 5: the real logo as layers in 3D */
const S5 = sceneGroup(), LW = 3.2, unit = LW/1875, LH = 199*unit;
S5.position.set(0, 1.4, 0);
const loader = new THREE.TextureLoader(), maxAniso = renderer.capabilities.getMaxAnisotropy();
const L = {};
for(const [k, v] of Object.entries(LOGO)){
  const tex = loader.load(v.src, ()=>{ if(!playing) renderFrame(); }); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = maxAniso;
  const mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, toneMapped:false, depthWrite:false});
  const m = new THREE.Mesh(new THREE.PlaneGeometry(v.w*unit, LH), mat);
  m.position.set((v.x + v.w/2)*unit - LW/2, 0, 0); m.renderOrder = k==='vy' ? 2 : 1;
  S5.add(m); L[k] = m;
}
const stripeGeo = new THREE.PlaneGeometry(1, .028); stripeGeo.translate(.5,0,0);
const stripe = new THREE.Mesh(stripeGeo, new THREE.MeshBasicMaterial({color:C.y, toneMapped:false}));
stripe.position.set(-LW/2, -LH/2 - .16, 0); stripe.scale.x = LW*.2; S5.add(stripe);

/* ---------- sound (Web Audio, synthesised) ---------- */
let ac = null, out = null, noise = null;
function initAudio(){
  if(ac) return;
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  ac = new AC();
  const comp = ac.createDynamicsCompressor(); out = ac.createGain(); out.gain.value = .9;
  out.connect(comp); comp.connect(ac.destination);
  noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
}
const now = () => ac.currentTime;
function env(g, peak, a, dcy){ const t = now(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dcy); }
const sfx = {
  whoosh(){ if(!ac) return; const s = ac.createBufferSource(); s.buffer = noise;
    const f = ac.createBiquadFilter(); f.type='bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(300, now()); f.frequency.exponentialRampToValueAtTime(2600, now()+.45);
    const g = ac.createGain(); env(g, .16, .2, .3);
    let node = g; if(ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.setValueAtTime(-.7,now()); p.pan.linearRampToValueAtTime(.7,now()+.5); g.connect(p); node = p; }
    s.connect(f); f.connect(g); node.connect(out); s.start(); s.stop(now()+.6); },
  tick(v=.07){ if(!ac) return; const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(1500,now()); o.frequency.exponentialRampToValueAtTime(650,now()+.05);
    env(g, v, .004, .07); o.connect(g); g.connect(out); o.start(); o.stop(now()+.1); },
  thud(v=.3){ if(!ac) return; const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150,now()); o.frequency.exponentialRampToValueAtTime(48,now()+.22);
    env(g, v, .006, .28); o.connect(g); g.connect(out); o.start(); o.stop(now()+.35); },
  blip(f){ if(!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle';
    o.frequency.value = f; env(g, .06, .005, .16); o.connect(g); g.connect(out); o.start(); o.stop(now()+.25); },
  chime(){ if(!ac) return; [523.25, 783.99, 1046.5].forEach((f,i)=>{ const o = ac.createOscillator(), g = ac.createGain();
      const t = now()+i*.06; o.frequency.value = f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.055,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+1.7);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+1.8); }); sfx.thud(.25); }
};

/* ---------- timeline ---------- */
const band = document.getElementById('band'), caps = [...document.querySelectorAll('.cap')], url = document.getElementById('url');
gsap.set(band, {xPercent:-131, skewX:-22, opacity:1});
const tl = gsap.timeline({paused:true, defaults:{ease:'power2.out'}});
const sound = fn => tl.call(()=>{ if(playing) fn(); });

function camTo(t, from, to, dur, ease='power2.inOut'){ tl.set(cam, from, t); tl.to(cam, {...to, duration:dur, ease}, t); }
function caption(i, t){
  const el = caps[i];
  tl.set(el, {visibility:'visible'}, t);
  tl.from(el.querySelectorAll('.line>span'), {yPercent:110, duration:.5, stagger:.08, ease:'power3.out'}, t+.12);
  tl.set(el, {visibility:'hidden'}, t+1.45);
}
function wipe(t, from, to){
  tl.set(band, {xPercent:-131}, t-.27);
  tl.call(()=>{ if(playing) sfx.whoosh(); }, null, t-.27);
  tl.to(band, {xPercent:-30.5, duration:.27, ease:'power2.in'}, t-.27);
  tl.set(from, {visible:false}, t); tl.set(to, {visible:true}, t);
  tl.to(band, {xPercent:70, duration:.32, ease:'power2.out'}, t);
}
const T1 = 1.5, T2 = 2.9, T3 = 4.3, T4 = 5.6, END = 7;

// 1 — desk and chair assemble
tl.set(S1, {visible:true}, 0);
camTo(0, {x:2.9,y:1.15,z:3.3,tx:0,ty:.85,tz:.2}, {x:-1.8,y:1.7,z:3.1}, T1, 'sine.inOut');
s1parts.forEach((p,i)=>{
  tl.from(p.position, {y:'+=1.3', duration:.42, ease:'back.out(1.5)'}, .1 + i*.045);
  if(i%3===0) tl.call(()=>{ if(playing) sfx.tick(); }, null, .1 + i*.045 + .3);
});
caption(0, .05);

// 2 — a whole classroom grows in
wipe(T1, S1, S2);
camTo(T1, {x:0,y:1.3,z:7.8,tx:0,ty:1.0,tz:0}, {x:4.8,y:7.4,z:6.2,ty:1.6}, 1.4);
tl.from(s2items.map(u=>u.scale), {x:.001,y:.001,z:.001, duration:.5, ease:'back.out(1.7)', stagger:{each:.045, from:'center', grid:[4,3]}}, T1+.05);
[0,.12,.24,.36].forEach(d=>tl.call(()=>{ if(playing) sfx.tick(.045); }, null, T1+.25+d));
caption(1, T1);

// 3 — interactive screen
wipe(T2, S2, S3);
camTo(T2, {x:1.9,y:1.1,z:4.0,tx:0,ty:1.55,tz:0}, {x:.25,y:1.3,z:2.5}, 1.4);
tl.fromTo(screenState, {p:0}, {p:1, duration:1.25, ease:'none'}, T2+.05);
[[.35,523.25],[.6,659.25],[.85,783.99]].forEach(([d,f])=>tl.call(()=>{ if(playing) sfx.blip(f); }, null, T2+d));
caption(2, T2);

// 4 — motion cubes tumble into a stack
wipe(T3, S3, S4);
camTo(T3, {x:3.3,y:1.5,z:3.4,tx:0,ty:1.05,tz:0}, {x:-3.0,y:2.0,z:3.7}, 1.3, 'sine.inOut');
cubes.forEach((c,i)=>{
  const t = T3 + .08 + i*.085;
  tl.from(c.position, {y:'+=3', duration:.55, ease:'bounce.out'}, t);
  tl.from(c.rotation, {x:(i%2?1:-1)*1.6, z:(i%3-1)*1.2, duration:.45, ease:'power2.out'}, t);
  tl.call(()=>{ if(playing) sfx.thud(.18 + (i===5?.12:0)); }, null, t + .2);
});
caption(3, T3);

// 5 — logo, large
wipe(T4, S4, S5);
camTo(T4, {x:-1.9,y:2.3,z:5.4,tx:0,ty:1.4,tz:0}, {x:0,y:1.4,z:9.0}, .95, 'power3.inOut');
tl.to(cam, {z:8.7, duration:END-T4-.95, ease:'none'}, T4+.95);
tl.from(L.vy.position, {y:'+=.55', duration:.5, ease:'power3.out'}, T4+.05);
tl.from(L.vy.material, {opacity:0, duration:.3}, T4+.05);
tl.from(L.vs.position, {y:'-=.55', duration:.5, ease:'power3.out'}, T4+.14);
tl.from(L.vs.material, {opacity:0, duration:.3}, T4+.14);
['A','N','E','R','U','M'].forEach((k,i)=>{
  const t = T4 + .22 + i*.065;
  tl.from(L[k].position, {z:-1.4, duration:.6, ease:'power3.out'}, t);
  tl.from(L[k].rotation, {y:-1.35, duration:.6, ease:'power3.out'}, t);
  tl.from(L[k].material, {opacity:0, duration:.3}, t);
});
tl.from(stripe.scale, {x:.0001, duration:.6, ease:'power3.inOut'}, T4+.75);
tl.call(()=>{ if(playing) sfx.chime(); }, null, T4+.62);
tl.set(url, {visibility:'visible'}, T4+.9);
tl.from(url, {opacity:0, y:8, duration:.5}, T4+.9);
tl.set({}, {}, END);

/* ---------- loop ---------- */
const prog = document.getElementById('prog');
function renderFrame(){
  camera.position.set(cam.x, cam.y, cam.z); camera.lookAt(cam.tx, cam.ty, cam.tz);
  if(S3.visible) drawScreen(screenState.p);
  prog.style.transform = `scaleX(${tl.progress()})`;
  renderer.render(scene, camera);
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if(!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); renderFrame();
}
new ResizeObserver(resize).observe(stage);
gsap.ticker.fps(60);
gsap.ticker.add(()=>{ if(playing) renderFrame(); });

let playing = false;
const cover = document.getElementById('cover'), playLabel = document.getElementById('playLabel');
tl.eventCallback('onComplete', ()=>{ playing = false; renderFrame(); playLabel.textContent = 'Opnieuw afspelen'; cover.hidden = false; });
document.getElementById('play').addEventListener('click', ()=>{
  initAudio(); if(ac && ac.state === 'suspended') ac.resume();
  cover.hidden = true; playing = true; tl.restart();
});

// poster: show the final logo frame at rest
tl.progress(1, true);
resize();
window.__vanerum = { tl, renderFrame, seek(t){ tl.seek(t, true); renderFrame(); } };
</script>
