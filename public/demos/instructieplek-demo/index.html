<style>
/* Vanerum-huisstijl: geel, zwart en wit, met lichtblauw/lila/groen als extra en de vier streepjes.
   Layout: zwarte kopbalk met logo; 3D-podium groot links, keuzepaneel rechts. Past op één 16:9-scherm; staand scherm onder elkaar. */
:root {
  --bg: #ffffff; --surface: #f4f4f2; --surface-2: #eaeae7; --ink: #1e1e1e; --muted: #5f5f5a; --line: #d6d6d1;
  --v-geel: #fbb900; --v-blauw: #b8e7f9; --v-groen: #a8cb67; --v-lila: #bda8bd; --v-zwart: #1e1e1e;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html { font-size: clamp(11px, 1.72vh, 24px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: .8rem; padding-inline: 1.2rem; padding-block: 0 .6rem; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem 2rem; background: var(--v-zwart); color: #fff; margin-inline: -1.2rem; padding: .75rem 1.2rem; min-width: 0; }
.brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.logo { height: 1.75rem; width: auto; display: block; }
.stripes { display: inline-flex; gap: .22rem; height: 1.1rem; flex: none; }
.stripes i { width: .32rem; background: var(--c); transform: skewX(-24deg); border-radius: 1px; }
.sep { width: 1px; align-self: stretch; background: rgb(255 255 255 / .25); }
h1 { font-family: var(--f-display); font-stretch: 78%; font-weight: 900; font-size: 2.1rem; line-height: 1; margin: 0; white-space: nowrap; }
h1 sup { color: var(--v-geel); font-size: .6em; }
.top small { color: #c9c9c4; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 28rem; gap: .8rem; min-height: 0; }
.stage { position: relative; background: linear-gradient(180deg, #dcf1f9 0%, #eef8fc 55%, #f7fbfc 100%); border-radius: 1.4rem; overflow: hidden; min-height: 0; }
.stage > canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--f-display); font-weight: 700; }
.hint { position: absolute; left: .9rem; bottom: .8rem; font-size: .85rem; color: var(--muted); background: rgb(255 255 255 / .85); padding: .3rem .75rem; border-radius: 99px; }
.dim { position: absolute; right: .9rem; top: .9rem; background: rgb(255 255 255 / .9); border-radius: .9rem; padding: .6rem .9rem; font-variant-numeric: tabular-nums; display: grid; gap: .1rem; }
.dim b { font-family: var(--f-display); font-stretch: 82%; font-size: 1.5rem; line-height: 1.1; }
.dim span { font-size: .8rem; color: var(--muted); }

.panel { background: var(--surface); border-radius: 1.4rem; padding: 1.2rem 1.3rem; overflow-y: auto; min-height: 0; display: grid; gap: .6rem; align-content: start; }
.panel h2 { font-family: var(--f-display); font-stretch: 82%; font-weight: 800; font-size: 1.7rem; line-height: 1.08; margin: 0; }
.panel p { margin: 0; }
.muted { color: var(--muted); font-size: .9rem; }
.group { display: grid; gap: .45rem; }
.group h3 { margin: 0; display: flex; justify-content: space-between; gap: .6rem; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.group h3 .h3r { display: flex; align-items: center; gap: .5rem; }
.flip { font: 700 .72rem/1 var(--f-body); color: var(--ink); background: #fff; border: 1.5px solid #1e1e1e; border-radius: 99px; padding: .22rem .55rem; cursor: pointer; text-transform: none; letter-spacing: 0; }
.flip[aria-pressed="true"] { background: #fbb900; }
.flip:disabled { opacity: .35; cursor: default; }
.flip:focus-visible { outline: 3px solid #fbb900; outline-offset: 2px; }
.group h3 span { text-transform: none; letter-spacing: 0; color: var(--ink); font-family: var(--f-body); font-weight: 700; font-size: .85rem; }
.shapes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem; }
.shapes button { display: grid; justify-items: center; gap: .2rem; padding: .45rem .2rem .35rem; background: var(--surface-2); border: 2px solid transparent; border-radius: .8rem; cursor: pointer; font-size: .8rem; font-weight: 700; }
.shapes svg { width: 2.6rem; height: 2rem; }
.shapes button[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); border-radius: .8rem; padding: .25rem; gap: .25rem; }
.seg button { border: 0; background: transparent; padding: .5rem .3rem; border-radius: .6rem; cursor: pointer; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.seg button:disabled { opacity: .35; cursor: default; }
.seg button[aria-pressed="true"] { background: var(--v-geel); color: var(--v-zwart); }
.swatches { display: flex; flex-wrap: wrap; gap: .35rem; }
.swatches button { width: 2.05rem; height: 2.05rem; border-radius: 50%; border: 2px solid rgb(0 0 0 / .12); background: var(--sw); cursor: pointer; padding: 0; position: relative; }
.swatches button.wood { background: repeating-linear-gradient(100deg, var(--sw) 0 3px, color-mix(in srgb, var(--sw) 82%, #5a3a1a) 3px 4px, var(--sw) 4px 8px); }
.swatches button.metal { background: linear-gradient(135deg, #e4e6e7, var(--sw) 55%, #7d8082); }
.swatches button[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.shapes button:focus-visible, .seg button:focus-visible, .swatches button:focus-visible, .btn:focus-visible { outline: 3px solid var(--v-geel); outline-offset: 2px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .9rem; margin: 0; font-size: .88rem; border-top: 1px solid var(--line); padding-top: .8rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.row { display: flex; gap: .4rem; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: transparent; padding: .4rem .8rem; border-radius: .7rem; cursor: pointer; font-weight: 700; font-size: .88rem; }
.btn:hover { background: var(--surface-2); }
footer { display: flex; justify-content: flex-end; align-items: center; gap: .6rem; font-size: .78rem; color: var(--muted); }
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  html { font-size: 15px; } body { overflow: auto; } .app { height: auto; min-height: 100%; }
  .top { flex-wrap: wrap; } .main { grid-template-columns: minmax(0, 1fr); } .stage { height: 55vh; min-height: 320px; } .panel { overflow: visible; }
}
</style>
<style>
/* Demo: één groot podium zonder knoppen; een rondleiding die zichzelf herhaalt, met een onderschrift per stap. */
.app { grid-template-rows: auto minmax(0, 1fr) auto; }
.demo { position: relative; min-height: 0; }
.demo .stage { position: absolute; inset: 0; }
.caption { position: absolute; left: 1.4rem; bottom: 1.3rem; max-width: min(34rem, 80%); background: rgb(255 255 255 / .92); border-radius: 1rem; padding: .8rem 1.1rem .9rem; display: grid; gap: .15rem; transition: opacity .5s; }
.caption small { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
.caption small i { display: inline-block; width: .32rem; height: .9rem; background: var(--v-geel); transform: skewX(-24deg); border-radius: 1px; }
.caption b { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 2.1rem; line-height: 1.05; }
.caption span { color: var(--muted); font-size: 1rem; }
.steps { position: absolute; right: 1.4rem; bottom: 1.5rem; display: flex; gap: .35rem; }
.steps i { width: .55rem; height: .55rem; border-radius: 99px; background: rgb(30 30 30 / .2); transition: background .3s, width .3s; }
.steps i.on { background: var(--v-zwart); width: 1.6rem; }
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  html, body { height: 100%; overflow: hidden; }
  .app { height: 100%; min-height: 0; grid-template-rows: auto minmax(0, 1fr); padding-bottom: .5rem; }
  .top small, footer, .sep { display: none; } .logo { height: 1.2rem; } h1 { font-size: 1.35rem; }
  .demo .stage { border-radius: 1rem; height: auto; min-height: 0; }
  .caption { left: .6rem; right: .6rem; bottom: .6rem; max-width: none; padding: .6rem .8rem; } .caption b { font-size: 1.45rem; } .caption span { font-size: .85rem; }
  .steps { right: .9rem; bottom: auto; top: .8rem; }
}
@media (prefers-reduced-motion: reduce) { .caption, .steps i { transition: none; } }
</style>

// opts: { frame, top, shell, chairs: bool, cabinet: bool }
function buildOpstelling(gltf, opts = {}) {
  const F = OA_FRAMES[opts.frame] || OA_FRAMES.wit, T = OA_TOPS[opts.top] || OA_TOPS.acacia, S = OA_SHELLS[opts.shell] || OA_SHELLS.olijf;

  const M = {
    top: std('blad', T.wood ? '#ffffff' : T.hex, .6, 0, { map: T.wood ? oaWoodTex(T.hex) : null }),
    frame: std('frame', F.hex, F.metal ? .35 : .5, F.metal ? .55 : .1),
    ncs: std('koppelstuk', '#b8b7b0', .5),
    under: std('onderzijde', '#5b5e60', .7),
    steel: std('stelvoet', '#a9adb1', .35, .6),
    glide: std('doppen', '#1d1e20', .7),
    tShell: std('bureaustoel-kuip', '#33363b', .6), tSeat: std('bureaustoel-zitting', '#2b2d31', .85), tBack: std('bureaustoel-rug', '#3a3d42', .8),
    tDetail: std('bureaustoel-delen', '#5a5d62', .5), tBase: std('bureaustoel-voet', '#1f2022', .45, .2), alu: std('aluminium', '#c4c7ca', .3, .7),
    cab: std('ladeblok', '#efede8', .5), cabBase: std('ladeblok-plint', '#2b2c2e', .6),
    shell: std('kuip', new THREE.Color(S.hex).multiplyScalar(OA_SHELL_K), .55, 0, { side: THREE.DoubleSide }), sframe: std('stoelframe', '#efebe2', .45, .15),

    const p = b.seat ? [b.seat[0], 0, b.seat[2]] : [(b.min[0] + b.max[0]) / 2, 0, (b.min[2] + b.max[2]) / 2];   // draaipunt

  if (parts.ladeblok) parts.ladeblok.visible = opts.cabinet !== false;

}



const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement); renderer.domElement.style.display = 'block'; renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8c88, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2.4, 6, 4.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: .5, far: 20 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.2 }));

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 80);

function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

// ---------- de opstelling ----------
let oa = null, P = null;
// tafels die uit elkaar rijden (met hun stoel): richting vanuit het midden van de drie driehoeken
const SPREAD = { tafel1: ['stoel2', .7, .7], tafel2: ['stoel1', -.7, .7], tafel3: ['stoel3', -.7, -.7] };
const PALETTE = [['acacia', 'olijf'], ['beuk', 'frenchblue'], ['wit', 'curry'], ['eik', 'lichtgrijs'], ['acacia', 'olijf']];
// ---------- rondleiding ----------
// cam: [doel x, y, z, richting x, y, z, breedte, hoogte, minimale afstand]
const STEPS = [
  { t: 6, title: 'Instructieplek', text: 'Een bureau voor de leerkracht met een instructietafel ertegenaan.', cam: [0, .45, 0, .6, .75, 1, 3.2, 2.2, 5.6] },
  { t: 6, title: 'Werkplek voor de leerkracht', text: 'MultiFLEX-bureau van 160 × 80 met een bureaustoel en een verrijdbaar ladeblok.', cam: [.45, .6, -.4, .55, .5, 1, 2.3, 1.6, 4.2], cabinet: true },
  { t: 6, title: 'Instructietafel', text: 'Drie MultiFLEX-driehoeken: drie leerlingen aan de schuine zijden, dicht bij de leerkracht.', cam: [-.5, .5, .25, -.35, .6, 1, 2.4, 1.7, 4.4] },
  { t: 8, title: 'Los of samen', text: 'De driehoeken hebben een wieltje in de rechte hoek: zo rij je ze los en weer terug.', cam: [-.3, .45, .1, .25, .9, 1, 4.0, 2.8, 6.4], spread: true },
  { t: 8, title: 'In jouw kleuren', text: 'Blad en kuip in de kleuren van je school.', cam: [0, .45, 0, -.6, .7, 1, 3.2, 2.2, 5.6], colors: true },
];
$('steps').innerHTML = STEPS.map(() => '<i></i>').join('');
function camFor(c) { const tgt = new THREE.Vector3(c[0], c[1], c[2]), dir = new THREE.Vector3(c[3], c[4], c[5]).normalize(); return { pos: tgt.clone().addScaledVector(dir, Math.max(c[8], fitDist(c[6], c[7]))), tgt }; }
let step = -1, stepT0 = 0, camFrom = null, camT0 = 0;
const look = new THREE.Vector3();
function enterStep(i, now) {
  step = i; stepT0 = now; const S = STEPS[i];
  const cap = $('caption'); cap.style.opacity = 0;
  setTimeout(() => { $('capStep').textContent = `${i + 1} van ${STEPS.length}`; $('capTitle').textContent = S.title; $('capText').textContent = S.text; cap.style.opacity = 1; }, reduce ? 0 : 450);
  [...$('steps').children].forEach((d, k) => d.classList.toggle('on', k === i));
  camFrom = { pos: camera.position.clone(), tgt: look.clone() }; camT0 = now;
}
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
let started = false, last = 0;
const cA = new THREE.Color(), cB = new THREE.Color(), woodTexs = {};
function topTex(k) { if (!woodTexs[k] && OA_TOPS[k].wood) woodTexs[k] = oaWoodTex(OA_TOPS[k].hex); return woodTexs[k] || null; }
function loop(now) {
  if (!oa) { requestAnimationFrame(loop); return; }
  if (!started) { started = true; const c = camFor(STEPS[0].cam); camera.position.copy(c.pos); look.copy(c.tgt); enterStep(0, now); last = now; }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  let S = STEPS[step], el = (now - stepT0) / 1000;
  if (el > S.t && !window.__hold) { enterStep((step + 1) % STEPS.length, now); S = STEPS[step]; el = 0; }
  const k = reduce ? 1 : Math.min(1, (now - camT0) / 2400), e = ease(k), to = camFor(S.cam);
  camera.position.lerpVectors(camFrom.pos, to.pos, e); look.lerpVectors(camFrom.tgt, to.tgt, e);
  if (!reduce) camera.position.x += Math.sin(now / 4500) * .06 * k;
  camera.lookAt(look);
  // ladeblok rijdt onder het bureau vandaan en weer terug
  { const L = P.ladeblok, h = L.userData.home; let d = 0;
    if (S.cabinet && !reduce) { const r = THREE.MathUtils.clamp((el - 1.4) / 3.6, 0, 1); d = Math.sin(Math.PI * ease(r)) * .55; }
    L.position.set(h.x + d, 0, h.z); }
  // driehoeken (met stoel) los rijden en weer terug; poppetjes zijn dan weg
  { let d = 0; if (S.spread && !reduce) { const r = THREE.MathUtils.clamp((el - .8) / 6.2, 0, 1); d = Math.sin(Math.PI * ease(r)) * .55; }
    for (const [t, [c, dx, dz]] of Object.entries(SPREAD)) for (const n of [t, c]) { const g = P[n], h = g.userData.home; g.position.set(h.x + dx * d, 0, h.z + dz * d); } }
  // kleuren van blad en kuip
  { const M = oa.userData.mats;
    if (S.colors) { const p = THREE.MathUtils.clamp(el / S.t, 0, .999) * (PALETTE.length - 1), i = Math.floor(p), fr = reduce ? 0 : ease(THREE.MathUtils.clamp((p - i) * 2.2 - .6, 0, 1));
      const [t0, s0] = PALETTE[i], [t1, s1] = PALETTE[i + 1], tk = fr < .5 ? t0 : t1;
      if (M.top.userData.k !== tk) { M.top.userData.k = tk; const T = OA_TOPS[tk]; M.top.map = topTex(tk); M.top.color.set(T.wood ? '#ffffff' : T.hex); M.top.needsUpdate = true; }
      M.shell.color.copy(cA.set(OA_SHELLS[s0].hex).lerp(cB.set(OA_SHELLS[s1].hex), fr)).multiplyScalar(OA_SHELL_K); }
    else if (M.top.userData.k !== 'acacia') { M.top.userData.k = 'acacia'; M.top.map = topTex('acacia'); M.top.color.set('#ffffff'); M.top.needsUpdate = true; M.shell.color.set(OA_SHELLS.olijf.hex).multiplyScalar(OA_SHELL_K); } }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loadOA().then(g => { oa = buildOpstelling(g, {}); scene.add(oa); P = oa.userData.parts; oa.userData.mats.top.userData.k = 'acacia'; $('loading').remove(); window.__ready = true; });
requestAnimationFrame(loop);
window.__goto = i => { started = true; last = performance.now(); enterStep(i, performance.now()); camFrom = camFor(STEPS[i].cam); };
</script>
