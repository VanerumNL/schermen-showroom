<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
/* Vanerum-huisstijl: geel, zwart en wit, met lichtblauw/lila/groen als extra en de vier streepjes.
   Layout: zwarte kopbalk met logo; 3D-podium groot links, keuzepaneel rechts. Past op één 16:9-scherm; staand scherm onder elkaar. */
:root {
  --bg: #ffffff; --surface: #f4f4f2; --surface-2: #eaeae7; --ink: #1e1e1e; --muted: #5f5f5a; --line: #d6d6d1;
  --v-geel: #fbb900; --v-blauw: #b8e7f9; --v-groen: #a8cb67; --v-lila: #bda8bd; --v-zwart: #1e1e1e;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html { font-size: clamp(11px, 1.72vh, 24px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: .8rem; padding-inline: 1.2rem; padding-block: 0 .6rem; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem 2rem; background: var(--v-zwart); color: #fff; margin-inline: -1.2rem; padding: .75rem 1.2rem; min-width: 0; }
.brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.logo { height: 1.75rem; width: auto; display: block; }
.stripes { display: inline-flex; gap: .22rem; height: 1.1rem; flex: none; }
.stripes i { width: .32rem; background: var(--c); transform: skewX(-24deg); border-radius: 1px; }
.sep { width: 1px; align-self: stretch; background: rgb(255 255 255 / .25); }
h1 { font-family: var(--f-display); font-stretch: 78%; font-weight: 900; font-size: 2.1rem; line-height: 1; margin: 0; white-space: nowrap; }
h1 sup { color: var(--v-geel); font-size: .6em; }
.top small { color: #c9c9c4; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 28rem; gap: .8rem; min-height: 0; }
.stage { position: relative; background: linear-gradient(180deg, #dcf1f9 0%, #eef8fc 55%, #f7fbfc 100%); border-radius: 1.4rem; overflow: hidden; min-height: 0; }
.stage > canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--f-display); font-weight: 700; }
.hint { position: absolute; left: .9rem; bottom: .8rem; font-size: .85rem; color: var(--muted); background: rgb(255 255 255 / .85); padding: .3rem .75rem; border-radius: 99px; }
.dim { position: absolute; right: .9rem; top: .9rem; background: rgb(255 255 255 / .9); border-radius: .9rem; padding: .6rem .9rem; font-variant-numeric: tabular-nums; display: grid; gap: .1rem; }
.dim b { font-family: var(--f-display); font-stretch: 82%; font-size: 1.5rem; line-height: 1.1; }
.dim span { font-size: .8rem; color: var(--muted); }

.panel { background: var(--surface); border-radius: 1.4rem; padding: 1.2rem 1.3rem; overflow-y: auto; min-height: 0; display: grid; gap: .6rem; align-content: start; }
.panel h2 { font-family: var(--f-display); font-stretch: 82%; font-weight: 800; font-size: 1.7rem; line-height: 1.08; margin: 0; }
.panel p { margin: 0; }
.muted { color: var(--muted); font-size: .9rem; }
.group { display: grid; gap: .45rem; }
.group h3 { margin: 0; display: flex; justify-content: space-between; gap: .6rem; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.group h3 .h3r { display: flex; align-items: center; gap: .5rem; }
.flip { font: 700 .72rem/1 var(--f-body); color: var(--ink); background: #fff; border: 1.5px solid #1e1e1e; border-radius: 99px; padding: .22rem .55rem; cursor: pointer; text-transform: none; letter-spacing: 0; }
.flip[aria-pressed="true"] { background: #fbb900; }
.flip:disabled { opacity: .35; cursor: default; }
.flip:focus-visible { outline: 3px solid #fbb900; outline-offset: 2px; }
.group h3 span { text-transform: none; letter-spacing: 0; color: var(--ink); font-family: var(--f-body); font-weight: 700; font-size: .85rem; }
.shapes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem; }
.shapes button { display: grid; justify-items: center; gap: .2rem; padding: .45rem .2rem .35rem; background: var(--surface-2); border: 2px solid transparent; border-radius: .8rem; cursor: pointer; font-size: .8rem; font-weight: 700; }
.shapes svg { width: 2.6rem; height: 2rem; }
.shapes button[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); border-radius: .8rem; padding: .25rem; gap: .25rem; }
.seg button { border: 0; background: transparent; padding: .5rem .3rem; border-radius: .6rem; cursor: pointer; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.seg button:disabled { opacity: .35; cursor: default; }
.seg button[aria-pressed="true"] { background: var(--v-geel); color: var(--v-zwart); }
.swatches { display: flex; flex-wrap: wrap; gap: .35rem; }
.swatches button { width: 2.05rem; height: 2.05rem; border-radius: 50%; border: 2px solid rgb(0 0 0 / .12); background: var(--sw); cursor: pointer; padding: 0; position: relative; }
.swatches button.wood { background: repeating-linear-gradient(100deg, var(--sw) 0 3px, color-mix(in srgb, var(--sw) 82%, #5a3a1a) 3px 4px, var(--sw) 4px 8px); }
.swatches button.metal { background: linear-gradient(135deg, #e4e6e7, var(--sw) 55%, #7d8082); }
.swatches button[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.shapes button:focus-visible, .seg button:focus-visible, .swatches button:focus-visible, .btn:focus-visible { outline: 3px solid var(--v-geel); outline-offset: 2px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .9rem; margin: 0; font-size: .88rem; border-top: 1px solid var(--line); padding-top: .8rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.row { display: flex; gap: .4rem; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: transparent; padding: .4rem .8rem; border-radius: .7rem; cursor: pointer; font-weight: 700; font-size: .88rem; }
.btn:hover { background: var(--surface-2); }
footer { display: flex; justify-content: flex-end; align-items: center; gap: .6rem; font-size: .78rem; color: var(--muted); }
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  html { font-size: 15px; } body { overflow: auto; } .app { height: auto; min-height: 100%; }
  .top { flex-wrap: wrap; } .main { grid-template-columns: minmax(0, 1fr); } .stage { height: 55vh; min-height: 320px; } .panel { overflow: visible; }
}
</style>
<style>
.seg.vars { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg.vars button small { display: block; font-weight: 400; font-size: .72rem; opacity: .75; }
.est { font-size: .75rem; color: var(--muted); }
.dim .tbl { font-size: .8rem; color: var(--muted); }
@media (max-width: 760px) { .brand { flex-wrap: wrap; row-gap: .4rem; } .brand .sep { display: none; } h1 { font-size: 1.7rem; } }
</style>

   Montserrat, ronde kaarten en pilknoppen, geel als accent (streepje boven koppen, gele punt), streepjes in de voet. */
:root {

.swatches button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.shapes button:focus-visible, .seg button:focus-visible, .swatches button:focus-visible, .btn:focus-visible, .flip:focus-visible { outline: 2px solid var(--geel); outline-offset: 2px; }

.demo .stage { z-index: 0; }
.demo .stage::after { display: none; }

const $ = id => document.getElementById(id);
