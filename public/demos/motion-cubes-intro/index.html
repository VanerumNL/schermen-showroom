<style>
/* Layout: one 9:16 stage, centred and letterboxed. Single dark look on purpose (reel style). */
:root{
  --ground:#060607;
  --stage:#0B0B0D;
  --ink:#F4F2F5;
  --accent:#47C3DE;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);display:grid;place-items:center;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stage{position:relative;aspect-ratio:9/16;height:min(100%,calc((100vw - 32px)*16/9));max-width:100%;background:var(--stage);overflow:hidden;container-type:size;border-radius:10px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sound{position:absolute;top:4cqw;right:4cqw;display:inline-flex;align-items:center;gap:1.8cqw;border:1px solid rgba(244,242,245,.25);border-radius:999px;background:rgba(11,11,13,.7);color:var(--ink);
  font:800 max(12px,3.2cqw)/1 var(--body);padding:2.4cqw 3.6cqw;cursor:pointer}
.sound svg{width:max(14px,4cqw);height:max(14px,4cqw)}
.cover{position:absolute;left:0;right:0;bottom:12cqh;display:grid;place-items:center}
.play{display:inline-flex;align-items:center;gap:3cqw;border:0;border-radius:999px;background:var(--ink);color:var(--stage);
  font:800 max(14px,3.8cqw)/1 var(--body);padding:3.6cqw 6.5cqw 3.6cqw 5.2cqw;cursor:pointer}
.play svg{width:max(14px,3.6cqw);height:max(14px,3.6cqw)}
.sound:focus-visible,.play:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>

/* ---------- word layout: M [cube] T I O N ---------- */
const S = 960 / (954 + 848 + 654 + 350 + 848 + 804);         // px per font unit
const CAP = GLYPHS.cap * S;

let SLOT = null;
const svgNS = 'http://www.w3.org/2000/svg', meas = document.createElementNS(svgNS, 'path');

holder.style.position = 'absolute'; holder.appendChild(meas); document.body.appendChild(holder);
function glyphPaths(ch, sc){
  const g = GLYPHS.g[ch];
  return { fill: new Path2D(g.d), contours: g.contours.map(d => { meas.setAttribute('d', d); return {p: new Path2D(d), len: meas.getTotalLength()}; }), adv: g.adv };
}
WORD.forEach((ch, i) => {
  if(ch === null){ SLOT = {x: pen, w: 848*S}; pen += 848*S; return; }
  const gp = glyphPaths(ch);
  letters.push({ch, x: pen, w: gp.adv*S, color: COLORS[letters.length], ...gp});
  pen += gp.adv*S;
});
// small "CUBES" line
const SUB_S = S*.42, SUB_TRACK = 60;
const sub = []; let subW = 0;
for(const ch of 'CUBES'){ const gp = glyphPaths(ch); sub.push({ch, ...gp, w: gp.adv*SUB_S}); subW += gp.adv*SUB_S + SUB_TRACK; }

const st = {lead:0, leadOut:0, x:0, y:-900, roll:0, csq:0, zoom:1, shake:0, flash:0, sub:0, glow:0};

/* ---------- the Motion Cube (three.js, off-screen) ---------- */
const MC = {ready:false};
(function(){
  try{
    const N = 720, EXT = .42, can = document.createElement('canvas'); can.width = can.height = N;
    const r = new THREE.WebGLRenderer({canvas:can, alpha:true, antialias:true, preserveDrawingBuffer:true});
    r.outputEncoding = THREE.sRGBEncoding; r.setClearColor(0x000000, 0);
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff, 0x202024, 1.05));
    const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-2, 3, 4); sc.add(key);
    const rim = new THREE.DirectionalLight(0xbfe9ff, 1.4); rim.position.set(3, 2, -3); sc.add(rim);
    const cam = new THREE.OrthographicCamera(-EXT, EXT, EXT, -EXT, .01, 10); cam.position.set(0, 0, 3);
    const bin = Uint8Array.from(atob(GLB), c => c.charCodeAt(0)).buffer;
    new THREE.GLTFLoader().parse(bin, '', g => {
      const m = g.scene; m.traverse(o => { if(o.isMesh && o.material) o.material.metalness = Math.min(o.material.metalness, .15); });
      const box = new THREE.Box3().setFromObject(m); m.position.sub(box.getCenter(new THREE.Vector3()));
      const tilt = new THREE.Group(); tilt.rotation.set(.32, -.62, 0); tilt.add(m);
      const roll = new THREE.Group(); roll.add(tilt); sc.add(roll);
      Object.assign(MC, {ready:true, r, sc, cam, can, roll, EXT, size: box.getSize(new THREE.Vector3())});

})();

/* ---------- canvases ---------- */
const stage = document.getElementById('stage'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scn = document.createElement('canvas'), sx = scn.getContext('2d');
const rfl = document.createElement('canvas'), rx = rfl.getContext('2d');
let scale = 1, T = 0;
function resize(){
  const r = stage.getBoundingClientRect(); if(!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = scn.width = rfl.width = Math.round(r.width*dpr);
  cv.height = scn.height = rfl.height = Math.round(r.height*dpr);
  scale = cv.width / FW; draw();
}
new ResizeObserver(resize).observe(stage);

const CUBE_W = 172;
function frameTransform(c){
  const z = st.zoom, ox = Math.sin(T*67)*st.shake*9, oy = Math.cos(T*49)*st.shake*9;
  c.setTransform(scale*z, 0, 0, scale*z, scale*(FW/2*(1-z) + ox), scale*(BASE*(1-z) + oy));
}
function drawLetters(c){
  letters.forEach((L, i) => {
    const d = st['d'+i], f = st['f'+i], w = st['w'+i];
    c.save(); c.translate(L.x + L.w/2, BASE); c.scale(1 + .05*w, 1 - .1*w); c.translate(-L.w/2, 0); c.scale(S, S);
    if(f > 0){                                     // fill: white flash, settling into the dot colour
      c.globalAlpha = Math.min(1, f*2.5);
      c.fillStyle = f < .35 ? '#FFFFFF' : L.color;
      if(f >= .35 && f < .7){ c.fillStyle = '#FFFFFF'; c.fill(L.fill); c.globalAlpha = (f - .35)/.35; c.fillStyle = L.color; }
      c.fill(L.fill); c.globalAlpha = 1;
    }
    if(d > 0){                                     // outline draws itself
      c.lineWidth = 3.2/S; c.strokeStyle = f > .5 ? L.color : '#FFFFFF'; c.lineJoin = 'round';
      for(const k of L.contours){ c.setLineDash([k.len, k.len]); c.lineDashOffset = k.len*(1 - d); c.stroke(k.p); }
      c.setLineDash([]);
    }
    c.restore();
  });
  // the lead line along the floor, like a pen coming in from the left
  if(st.lead > 0){
    const x0 = -40 + (letters[0].x + 40)*st.leadOut, x1 = -40 + (letters[0].x + 40)*st.lead;
    if(x1 > x0){ c.strokeStyle = '#FFFFFF'; c.lineWidth = 3.2; c.beginPath(); c.moveTo(x0, BASE); c.lineTo(x1, BASE); c.stroke(); }
  }
}
function drawCube(c){
  if(!MC.ready || st.y < -800) return;
  if(!MC.U){ MC.roll.rotation.z = 0; MC.roll.updateMatrixWorld(true);       // size so that the cube at rest fills the O-slot
    const b0 = new THREE.Box3().setFromObject(MC.roll); MC.U = SLOT.w*.98/(b0.max.x - b0.min.x); }

  c.drawImage(MC.can, -mid*U - half, low*U - half, half*2, half*2);

function draw(){
  const W = cv.width, H = cv.height;
  // scene (word + cube) on its own layer, so it can be mirrored on the floor
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,W,H);
  frameTransform(sx); drawLetters(sx); drawCube(sx);
  // background with a soft spotlight
  ctx.setTransform(1,0,0,1,0,0);
  const g = ctx.createRadialGradient(W/2, H*.5, 0, W/2, H*.5, H*.62);
  g.addColorStop(0, '#1A1A1E'); g.addColorStop(.55, '#0E0E11'); g.addColorStop(1, '#050506');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // impact glow behind the cube
  if(st.glow > 0){
    const cxp = scale*(SLOT.x + SLOT.w/2), cyp = scale*(BASE - CAP/2), rg = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, scale*520);
    rg.addColorStop(0, `rgba(71,195,222,${.28*st.glow})`); rg.addColorStop(1, 'rgba(71,195,222,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  }
  // floor reflection
  const by = scale*(BASE*(1 - st.zoom) + BASE*st.zoom);
  rx.setTransform(1,0,0,1,0,0); rx.clearRect(0,0,W,H);
  rx.save(); rx.translate(0, 2*by); rx.scale(1, -1); rx.drawImage(scn, 0, 0); rx.restore();
  rx.globalCompositeOperation = 'destination-in';
  const fg = rx.createLinearGradient(0, by, 0, by + scale*190); fg.addColorStop(0, 'rgba(0,0,0,.32)'); fg.addColorStop(1, 'rgba(0,0,0,0)');

  rx.fillStyle = '#000'; rx.globalCompositeOperation = 'destination-out'; rx.fillRect(0, 0, W, by);
  rx.globalCompositeOperation = 'source-over';
  ctx.drawImage(rfl, 0, 0);
  ctx.drawImage(scn, 0, 0);
  // white flash on impact
  if(st.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${.22*st.flash})`; ctx.fillRect(0,0,W,H); }
  // CUBES, letter-spaced, rising in one by one
  if(st.sub > 0){
    frameTransform(ctx);
    let x = FW/2 - subW/2; const y = BASE + 300;
    sub.forEach((L, i) => {

}

let ac = null, out = null, noise = null;

  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + a + dcy + .05); return fl; }

    tone(f*2, 'triangle', .035, .003, .15); noiseBurst('lowpass', 800, .7, .07, .002, .05); },
  whoosh(){ const fl = noiseBurst('bandpass', 350, 1.1, .12, .55, .35); fl.frequency.exponentialRampToValueAtTime(3200, now() + .85); },
  impact(){ const o = tone(140, 'sine', .45, .003, .45); o.frequency.exponentialRampToValueAtTime(40, now() + .4); noiseBurst('lowpass', 1200, .7, .2, .002, .2);
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f,i) => tone(f, 'triangle', .05, .01, 1.6, now() + .04 + i*.05)); },
  shimmer(){ [1568, 2093, 2637].forEach((f,i) => tone(f, 'sine', .03, .01, .6, now() + i*.08)); }
};
let playing = false;
const play = fn => () => { if(playing && ac) fn(); };

/* ---------- timeline ---------- */
const tl = gsap.timeline({paused:true});
tl.to(st, {zoom:1.06, duration:6.2, ease:'none'}, 0);
// 1. a pen line comes in along the floor and draws the outlines
tl.to(st, {lead:1, duration:.4, ease:'power1.in'}, .05);
tl.to(st, {leadOut:1, duration:.35, ease:'power1.inOut'}, .45);
tl.call(play(() => sfx.draw()), null, .05);
letters.forEach((L, i) => tl.to(st, {['d'+i]:1, duration:.55, ease:'power1.inOut'}, .38 + i*.16));
// 2. the cube drops in on the M and hops from letter to letter, filling each one
const topOf = i => BASE - CAP - (letters[i].ch === 'O' ? 6 : 0);
const cx = i => letters[i].x + letters[i].w/2;
const notes = [523.25, 587.33, 659.25, 783.99, 880];
const D0 = 1.35;
tl.set(st, {x:cx(0), y:-700, roll:0}, D0);
tl.to(st, {y:topOf(0), duration:.42, ease:'power2.in'}, D0);
let t = D0 + .42;
function land(i, at){
  tl.to(st, {csq:1, duration:.05, ease:'power2.out'}, at); tl.to(st, {csq:0, duration:.28, ease:'back.out(3)'}, at + .05);
  tl.fromTo(st, {['f'+i]:0}, {['f'+i]:1, duration:.45, ease:'none', immediateRender:false}, at);
  tl.fromTo(st, {['w'+i]:1}, {['w'+i]:0, duration:.5, ease:'elastic.out(1, .4)', immediateRender:false}, at);
  tl.call(play(() => sfx.hop(notes[i])), null, at);
}
land(0, t);
for(let i = 1; i < letters.length; i++){
  const dur = i === 1 ? .46 : .36, h = i === 1 ? 210 : 150, from = st;
  const yFrom = topOf(i - 1), yTo = topOf(i), apex = Math.min(yFrom, yTo) - h;
  tl.to(st, {x:cx(i), duration:dur, ease:'none'}, t + .04);
  tl.to(st, {y:apex, duration:dur/2, ease:'power2.out'}, t + .04);
  tl.to(st, {y:yTo, duration:dur/2, ease:'power2.in'}, t + .04 + dur/2);
  tl.to(st, {roll:-Math.PI/2*i, duration:dur, ease:'power1.inOut'}, t + .04);
  t += .04 + dur; land(i, t);
}
// 3. a big jump back into its own place, with a full spin
const J0 = t + .22, JD = .9, SLOT_X = SLOT.x + SLOT.w/2;
tl.to(st, {csq:.6, duration:.12, ease:'power2.out'}, t + .1);
tl.to(st, {csq:0, duration:.1}, J0);
tl.call(play(() => sfx.whoosh()), null, J0);
tl.to(st, {x:SLOT_X, duration:JD, ease:'power1.inOut'}, J0);
tl.to(st, {y:BASE - CAP - 430, duration:JD*.48, ease:'power2.out'}, J0);
tl.to(st, {y:BASE, duration:JD*.52, ease:'power3.in'}, J0 + JD*.48);
tl.to(st, {roll:0, duration:JD, ease:'power2.inOut'}, J0);
// 4. impact
const L0 = J0 + JD;
tl.to(st, {csq:1, duration:.06, ease:'power2.out'}, L0); tl.to(st, {csq:0, duration:.45, ease:'back.out(3)'}, L0 + .06);
tl.fromTo(st, {shake:1}, {shake:0, duration:.45, ease:'power2.out', immediateRender:false}, L0);
tl.fromTo(st, {flash:1}, {flash:0, duration:.35, ease:'power2.out', immediateRender:false}, L0);
tl.fromTo(st, {glow:1}, {glow:.35, duration:1.4, ease:'power2.out', immediateRender:false}, L0);
letters.forEach((L, i) => { const d = Math.abs(cx(i) - SLOT_X)/900;
  tl.fromTo(st, {['w'+i]:.8}, {['w'+i]:0, duration:.6, ease:'elastic.out(1, .4)', immediateRender:false}, L0 + d*.25); });
tl.call(play(() => sfx.impact()), null, L0);
// 5. CUBES rises in underneath
tl.to(st, {sub:1, duration:.9, ease:'power2.out'}, L0 + .45);
tl.call(play(() => sfx.shimmer()), null, L0 + .5);
tl.set({}, {}, L0 + 2.1);

/* ---------- playback ---------- */
const cover = document.getElementById('cover'), soundBtn = document.getElementById('sound');
gsap.ticker.fps(60);
gsap.ticker.add(() => { if(playing){ T = tl.time(); draw(); } });
tl.eventCallback('onComplete', () => { playing = false; draw(); cover.hidden = false; soundBtn.hidden = true; });
function startWithSound(){ initAudio(); if(ac && ac.state === 'suspended') ac.resume(); soundBtn.hidden = true; cover.hidden = true; playing = true; tl.restart(); }
document.getElementById('play').addEventListener('click', startWithSound);
soundBtn.addEventListener('click', startWithSound);
resize();
playing = true; tl.restart();     // starts straight away, without sound until "Geluid aan"
window.__anim = { seek(t){ tl.seek(t, true); T = t; draw(); }, duration: () => tl.duration() };
</script>
