<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Startscherm</title>
<link rel="icon" href="/img/kiosk-icoon.png">
<style>
/* Startscherm voor een touchscreen in de zorg: grote tegels die een website, filmpje, radio of fotoalbum openen.
   Altijd een grote Terug-knop; na een tijd zonder aanraking vanzelf terug naar de tegels. */
@font-face{font-family:"Neue Montreal";src:url(/fonts/NeueMontreal-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Neue Montreal";src:url(/fonts/NeueMontreal-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--geel:#fbb900;--zwart:#1e1e1e;--antraciet:#2e3033;--font:"Neue Montreal",Arial,sans-serif;
  --bg:linear-gradient(180deg,#fbf3e2 0%,#fdf8ef 60%,#fffdf8 100%);--ink:#1e1e1e;--w:1920px;--h:1080px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:var(--font);letter-spacing:.02em;color:var(--zwart);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.geenmuis,body.geenmuis *{cursor:none!important}
button{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

.laag{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.vlak{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%);transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--ink)}

/* ===== tegels ===== */
#thuisVlak{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.kop{display:flex;align-items:flex-end;gap:40px;padding:52px 72px 40px}
.kop .links{flex:1;min-width:0}
.plek{display:flex;align-items:center;gap:18px;font-weight:700;font-size:30px;opacity:.8;margin-bottom:14px}
.plek img.str{height:28px;display:block}
.plek img.logo{height:58px;display:block;max-width:420px;object-fit:contain}
.kop h1{margin:0;font-size:128px;line-height:.9;letter-spacing:0;font-weight:700}
/* de datum onder de tegels, zo groot als past */
.datumvoet{padding:0 72px 36px;text-align:center;font-weight:700;letter-spacing:0;line-height:1;white-space:nowrap;overflow:hidden}
.kop .klok{font-size:128px;font-weight:700;line-height:.9;letter-spacing:0;font-variant-numeric:tabular-nums}
.tegels{display:grid;gap:var(--gap,36px);padding:0 72px 56px;min-height:0;grid-template-columns:repeat(var(--kol,3),var(--maat,360px));grid-auto-rows:var(--maat,360px);justify-content:center;align-content:center}
.tegel{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;width:var(--maat,360px);height:var(--maat,360px);background:#fff;color:var(--zwart);border-radius:calc(var(--maat,360px) * .12);overflow:hidden;text-align:left;
  box-shadow:0 2px 0 rgba(30,30,30,.05),0 22px 48px rgba(30,30,30,.10);transition:transform .15s ease;min-height:0}
.tegel:active{transform:scale(.97)}
.tegel .beeld{position:relative;background:var(--c);min-height:0;overflow:hidden}
.tegel .beeld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tegel .beeld svg{position:absolute;left:50%;top:50%;height:80%;max-width:80%;transform:translate(-50%,-50%)}
.tegel .naam{display:flex;align-items:center;justify-content:center;padding:calc(var(--maat,360px) * .055) calc(var(--maat,360px) * .07);font-weight:700;font-size:calc(var(--maat,360px) * .125);line-height:1.05;letter-spacing:0;border-top:calc(var(--maat,360px) * .03) solid var(--c);text-align:center}
.tegel .naam span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tegel.onaf{opacity:.45}
.tegel.onaf::after{content:"Nog instellen";position:absolute;left:20px;top:20px;background:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:24px}
/* tegels aanpassen op het scherm zelf */
.tegel.plus{background:transparent;border:8px dashed rgba(30,30,30,.35);box-shadow:none;display:grid;place-items:center;grid-template-rows:1fr;color:var(--ink)}
.tegel.plus b{font-size:calc(var(--maat,360px) * .42);line-height:1;font-weight:400}
.tegel.plus span{display:block;font-size:calc(var(--maat,360px) * .1);font-weight:700;text-align:center;margin-top:-10px}
.bewerk .tegel:not(.plus){animation:wiebel .5s ease-in-out infinite alternate}
@keyframes wiebel{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.tegel .weg{position:absolute;right:14px;top:14px;width:96px;height:96px;border-radius:50%;background:#1e1e1e;color:#fff;display:grid;place-items:center;font-size:52px;font-weight:700;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.tegel .kies{position:absolute;left:14px;right:124px;top:14px;background:var(--geel);color:var(--zwart);border:4px solid var(--zwart);border-radius:999px;padding:14px 20px;font-weight:700;font-size:30px;text-align:center;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.tegel .kies.ok{background:#fff}
.bewerkkop{display:flex;align-items:center;gap:40px;padding:52px 72px 40px}
.bewerkkop div{flex:1}
.bewerkkop h1{margin:0;font-size:76px;line-height:1;letter-spacing:0}
.bewerkkop p{margin:14px 0 0;font-size:38px;opacity:.75}
.leeg{display:grid;place-items:center;text-align:center;font-size:44px;opacity:.7;padding:80px}

/* ===== bekijken ===== */
#bekijk .vlak{display:grid;grid-template-rows:auto minmax(0,1fr);background:#111}
.balk{display:flex;align-items:center;gap:40px;padding:22px 40px;background:var(--zwart);color:#fff;height:160px}
.balk .terug{display:inline-flex;align-items:center;gap:22px;background:var(--geel);color:var(--zwart);font-weight:700;font-size:56px;border-radius:999px;padding:0 54px 0 40px;height:116px;flex:none}
.balk .terug svg{width:52px;height:52px}
.balk .terug:active{transform:scale(.97)}
.balk h2{flex:1;margin:0;font-size:58px;font-weight:700;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balk .klok{font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.85}
.inhoud{position:relative;min-height:0;overflow:hidden;background:#111}
.inhoud iframe,.inhoud video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.inhoud iframe.site{background:#fff}
.inhoud video{object-fit:cover}
.bericht{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:34px;text-align:center;padding:80px;background:#fdf8ef;color:var(--zwart)}
.bericht b{font-size:62px;line-height:1.1}
.bericht p{margin:0;font-size:40px;line-height:1.3;opacity:.75;max-width:1300px}
.grootknop{display:inline-flex;align-items:center;justify-content:center;gap:24px;background:var(--geel);color:var(--zwart);font-weight:700;font-size:54px;border-radius:999px;padding:30px 60px}
.laden{position:absolute;inset:0;display:grid;place-items:center;background:#fdf8ef;font-weight:700;font-size:48px;color:#5f5d58;transition:opacity .5s}
.laden.weg{opacity:0;pointer-events:none}

/* foto's (album en achter de radio) */
.dia{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background:#111}
.dia.aan{opacity:1}
.dia .vaag{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.6);transform:scale(1.1)}
.dia img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.dia .ondertitel{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);max-width:80%;background:#fff;color:var(--zwart);border-radius:26px;padding:22px 40px;font-size:46px;font-weight:700;line-height:1.2;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.pijl{position:absolute;top:50%;transform:translateY(-50%);width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:3}
.pijl svg{width:70px;height:70px}
.pijl.l{left:44px}.pijl.r{right:44px}
.pijl:active{transform:translateY(-50%) scale(.94)}

/* radio */
.radio{position:absolute;inset:0;display:grid;place-items:center}
.radio .achter{position:absolute;inset:0;background:var(--c);display:grid;place-items:center}
.radio .achter svg{height:62%;opacity:.95}
.radio .paneel{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;align-items:center;gap:44px;background:#fff;border-radius:999px;padding:26px 30px 26px 56px;box-shadow:0 22px 50px rgba(0,0,0,.28);z-index:3}
.radio .info{min-width:420px;max-width:760px}
.radio .info b{display:block;font-size:56px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio .info span{display:block;font-size:34px;opacity:.7;margin-top:8px}
.rond{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--zwart);color:#fff}
.rond.hoofd{width:210px;height:210px;background:var(--geel);color:var(--zwart)}
.rond svg{width:46%;height:46%}
.rond:active{transform:scale(.95)}
.volume{display:flex;gap:22px}

.radio .zenders{position:absolute;left:50%;top:40px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:20px;width:calc(100% - 120px);z-index:3}
.radio .zenders button{background:rgba(255,255,255,.92);color:var(--zwart);font-weight:700;font-size:40px;border-radius:999px;padding:22px 40px;box-shadow:0 12px 30px rgba(0,0,0,.25);border:6px solid transparent;max-width:640px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio .zenders button.aan{background:var(--geel);border-color:var(--zwart)}
.radio .zenders button:active{transform:scale(.96)}
.volgendknop{position:absolute;right:40px;bottom:40px;z-index:3;display:inline-flex;align-items:center;gap:18px;background:var(--geel);color:var(--zwart);font-weight:700;font-size:48px;border-radius:999px;padding:26px 34px 26px 50px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.volgendknop svg{width:52px;height:52px}
.volgendknop:active,.volgendknop.tik{transform:scale(.95)}
/* oude journaals */
.journaal video{object-fit:contain!important;background:#000}
.journaal .over{position:absolute;left:56px;top:48px;max-width:70%;background:#fff;color:var(--zwart);border-radius:26px;padding:22px 34px;box-shadow:0 18px 40px rgba(0,0,0,.3);transition:opacity 1.2s;z-index:2}
.journaal .over b{display:block;font-size:52px;line-height:1.1}
.journaal .over span{display:block;font-size:36px;opacity:.75;margin-top:6px}
.journaal .over.weg{opacity:0}
.journaal .bron{position:absolute;right:24px;bottom:18px;font-size:20px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:6px 14px;border-radius:999px;z-index:2}
.journaal .volgende{position:absolute;right:44px;top:50%;transform:translateY(-50%);z-index:3}

/* dialogen voor het aanpassen op het scherm */
#beheerLaag{background:rgba(30,30,30,.55)}
#beheerLaag .vlak{background:transparent;display:grid;place-items:center}
.dlg{background:#fff;color:var(--zwart);border-radius:44px;padding:44px 56px;width:min(1500px,calc(var(--w) - 120px));max-height:calc(var(--h) - 80px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dlg h2{margin:0 0 12px;font-size:60px;letter-spacing:0}
.dlg .sub{margin:0 0 30px;font-size:34px;opacity:.7}
.dlg label{display:block;font-weight:700;font-size:30px;margin:16px 0 8px}
.dlg .twee{display:grid;grid-template-columns:1fr 2fr;gap:28px}
.dlg .twee.ruim{grid-template-columns:auto auto;justify-content:space-between;align-items:start}
.dlg input{width:100%;font:inherit;font-size:38px;padding:16px 24px;border:3px solid #d8d6d0;border-radius:22px;outline:0;background:#fff;color:var(--zwart)}
.dlg input:focus{border-color:var(--zwart);box-shadow:0 0 0 6px var(--geel)}
.dlg .knoppen{display:flex;gap:24px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.dlg .knop2{font-weight:700;font-size:38px;border-radius:999px;padding:20px 48px;background:#efeee9}
.dlg .knop2.geel{background:var(--geel)}
.dlg .knop2.zwart{background:var(--zwart);color:#fff}
.dlg .fout{color:#b3261e;font-weight:700;font-size:30px;margin-top:14px;min-height:1em}
.dlg .knoppen .fout{flex:1;margin:0;align-self:center}
.keuzes{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.keuze{display:grid;grid-template-rows:150px auto;border-radius:30px;overflow:hidden;background:#fff;border:3px solid #e4e2dc;text-align:center}
.keuze .k{background:var(--c);position:relative}
.keuze .k svg{position:absolute;left:50%;top:50%;height:80%;transform:translate(-50%,-50%)}
.keuze b{display:block;padding:16px 10px 4px;font-size:32px}
.keuze small{display:block;padding:0 10px 16px;font-size:24px;opacity:.65}
.ikonen{display:flex;flex-wrap:wrap;gap:8px}
.ikonen button{width:72px;height:72px;border-radius:22px;border:3px solid #e4e2dc;padding:8px;background:#fff}
.ikonen button.aan{border-color:var(--zwart);box-shadow:0 0 0 6px var(--geel)}
.ikonen svg{width:100%;height:100%;display:block}
.kleurrij{display:flex;gap:18px;flex-wrap:wrap}
.kleurrij button{width:72px;height:72px;border-radius:50%;border:3px solid rgba(0,0,0,.15)}
.kleurrij button.aan{box-shadow:0 0 0 6px #fff,0 0 0 12px var(--zwart)}
.toetsen{margin-top:22px;background:#efeee9;border-radius:30px;padding:16px;display:flex;flex-direction:column;gap:10px}
.toetsen .r{display:flex;gap:12px;justify-content:center}
.toetsen button{flex:1;max-width:118px;height:70px;border-radius:18px;background:#fff;font-size:40px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.toetsen button.breed{max-width:260px;flex:2}
.toetsen button.spatie{max-width:520px;flex:5}
.toetsen button.aan{background:var(--geel)}
.toetsen button:active{transform:translateY(2px);box-shadow:none}

/* een melding die over alles heen ligt */
.melding{position:fixed;inset:0;display:grid;place-items:center;background:#fdf8ef;font-size:3vh;color:var(--antraciet);text-align:center;gap:3vh;align-content:center;padding:6vh}
</style>
</head>
<body>
<section class="laag" id="thuis"><div class="vlak" id="thuisVlak"></div></section>
<section class="laag" id="bekijk" hidden><div class="vlak">
  <header class="balk">
    <button class="terug" id="terug" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Terug</button>
    <h2 id="bekijkTitel"></h2>
    <div class="klok" data-klok></div>
  </header>
  <div class="inhoud" id="inhoud"></div>
</div></section>

<section class="laag" id="beheerLaag" hidden><div class="vlak" id="beheerVlak"></div></section>

<script src="/startscherm-gedeeld.js"></script>
<script src="/spellen.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const { esc } = SS;
  const params = new URLSearchParams(location.search);
  const VOORBEELD = params.has("voorbeeld");
  const ID = (location.pathname.match(/^\/t\/([a-z0-9-]+)/) || [])[1] || params.get("t") || "";
  let cfg = null, modus = "thuis", open = null, laatsteAanraking = Date.now();

  const PIJL_L = '<svg viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  const PIJL_R = '<svg viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  const SPEEL = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const PAUZE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  const MIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>';

  /* ---------- timers die bij het sluiten opgeruimd worden ---------- */
  let timers = [];
  const later = (f, ms) => { const t = setTimeout(f, ms); timers.push(t); return t; };
  const elke = (f, ms) => { const t = setInterval(f, ms); timers.push(t); return t; };
  const ruimOp = () => { timers.forEach(t => { if (t && t.stop) { try { t.stop(); } catch (e) {} } else { clearTimeout(t); clearInterval(t); } }); timers = []; };

  /* ---------- schalen naar het scherm ---------- */
  const maat = () => cfg && cfg.start && cfg.start.stand === "staand" ? [1080, 1920] : [1920, 1080];
  function schaal() {
    const [w, h] = maat();
    document.documentElement.style.setProperty("--w", w + "px"); document.documentElement.style.setProperty("--h", h + "px");
    const k = Math.min(innerWidth / w, innerHeight / h);
    document.querySelectorAll(".vlak").forEach(v => { v.style.transform = `translate(-50%,-50%) scale(${k})`; });
  }
  addEventListener("resize", () => { schaal(); pasDatumAan(); pasTegelsAan(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { pasDatumAan(); pasTegelsAan(); });

  /* ---------- klok en groet ---------- */
  const DAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
  const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
  function groet(d) { const u = d.getHours(); return u < 6 ? "Goedenacht" : u < 12 ? "Goedemorgen" : u < 18 ? "Goedemiddag" : "Goedenavond"; }
  function tijd(d) { return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function tikKlok() {
    const d = new Date();
    document.querySelectorAll("[data-klok]").forEach(e => { e.textContent = tijd(d); });
    const g = document.querySelector("[data-groet]"); if (g) g.textContent = groet(d);
    const dt = document.querySelector("[data-datum]");
    if (dt) {
      const dag = DAGEN[d.getDay()], tekst = `${dag[0].toUpperCase() + dag.slice(1)} ${d.getDate()} ${MAANDEN[d.getMonth()]}`;
      if (dt.textContent !== tekst) { dt.textContent = tekst; pasDatumAan(); pasTegelsAan(); }
    }
  }
  /* de datum zo groot mogelijk: zo breed als het scherm, maar niet hoger dan een vijfde ervan */
  function pasDatumAan() {
    const dt = document.querySelector("[data-datum]"); if (!dt) return;
    const v = $("thuisVlak"), W = v.clientWidth - 144, staand = v.clientHeight > v.clientWidth;
    dt.style.fontSize = "100px";
    const r = document.createRange(); r.selectNodeContents(dt);
    const breed = r.getBoundingClientRect().width / (v.getBoundingClientRect().width / v.clientWidth || 1) || 1;
    dt.style.fontSize = Math.floor(Math.min(100 * W / breed * 0.97, staand ? 150 : 170)) + "px";
  }
  setInterval(tikKlok, 5000);

  /* ---------- de tegels ---------- */
  const zichtbaar = () => (cfg.tegels || []).map((t, i) => ({ t, i })).filter(x => VOORBEELD ? x.t && x.t.titel : SS.compleet(x.t));
  /* vierkante tegels: zoek de indeling (kolommen) waarbij de tegels zo groot mogelijk worden */
  function pasTegelsAan() {
    const box = $("thuisVlak").querySelector(".tegels"); if (!box) return;
    const v = $("thuisVlak"), kop = v.querySelector(".kop, .bewerkkop");
    const n = box.children.length, gap = n > 9 ? 28 : 36;
    const voet = v.querySelector(".datumvoet");
    const W = v.clientWidth - 144, H = v.clientHeight - (kop ? kop.offsetHeight : 0) - (voet ? voet.offsetHeight + 8 : 0) - 64;
    let best = 0, kol = 1;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c), m = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r);
      if (m > best + 0.5) { best = m; kol = c; }
    }
    best = Math.floor(Math.min(best, 560));
    box.style.setProperty("--maat", best + "px"); box.style.setProperty("--kol", kol); box.style.setProperty("--gap", gap + "px");
  }
  function tegelHtml(t, i) {
    return `<button class="tegel${SS.compleet(t) ? "" : " onaf"}" type="button" data-i="${i}" style="--c:${esc(t.kleur || "#fbb900")}">
      <div class="beeld">${t.foto ? `<img src="${esc(t.foto)}" alt="">` : ((SS.ICONEN[t.icoon] || SS.ICONEN.ster).svg)}</div>
      <div class="naam"><span>${esc(t.titel)}</span></div>${bewerk ? `<span class="weg" data-weg="${i}" aria-label="Weghalen">✕</span>` : ""}${bewerk && t.soort === "video" && (t.lokaal || !SS.compleet(t)) ? `<span class="kies" data-kies="${i}">📁 Kiezen</span>` : ""}
    </button>`;
  }
  function tekenThuis() {
    const s = cfg.start || {}, v = $("thuisVlak");
    const lijst = bewerk ? (cfg.tegels || []).map((t, i) => ({ t, i })).filter(x => x.t) : zichtbaar();
    const bg = SS.achtergrond(s.achtergrond);
    document.documentElement.style.setProperty("--bg", bg.bg); document.documentElement.style.setProperty("--ink", bg.ink);
    const plek = s.logo ? `<img class="logo" src="${esc(s.logo)}" alt="">` : (s.vanerum ? `<img class="logo" src="${bg.ink === "#ffffff" ? "/img/logo-wit.png" : "/img/logo.png"}" alt="Vanerum" style="height:40px">` : "");
    const kopHtml = bewerk
      ? `<header class="bewerkkop"><div><h1>Tegels aanpassen</h1><p>Tik op ✕ om een tegel weg te halen, of op + om er een toe te voegen.</p></div><button class="grootknop" type="button" data-actie="klaar">Klaar</button></header>`
      : s.welkom !== false
      ? `<header class="kop"><div class="links"><div class="plek"><img class="str" src="/img/streepjes.png" alt="">${plek}${s.titel ? `<span>${esc(s.titel)}</span>` : ""}</div><h1 data-groet></h1></div><div class="klok" data-klok></div></header>`
      : `<header class="kop"><div class="links"><div class="plek" style="margin:0"><img class="str" src="/img/streepjes.png" alt="">${plek}${s.titel ? `<span style="font-size:52px;opacity:1">${esc(s.titel)}</span>` : ""}</div></div><div class="klok" data-klok style="font-size:72px"></div></header>`;
    v.classList.toggle("bewerk", bewerk);
    v.innerHTML = kopHtml + (lijst.length || bewerk
      ? `<div class="tegels">${lijst.map(({ t, i }) => tegelHtml(t, i)).join("")}${bewerk ? `<button class="tegel plus" type="button" data-actie="plus"><div><b>+</b><span>Toevoegen</span></div></button>` : ""}</div>`
      : `<div class="leeg">Er staan nog geen tegels klaar.</div>`)
      + (!bewerk && s.welkom !== false ? `<footer class="datumvoet" data-datum></footer>` : "");
    v.querySelectorAll(".tegel img").forEach(img => img.addEventListener("error", () => { const b = img.parentNode; img.remove(); b.insertAdjacentHTML("beforeend", SS.ICONEN.ster.svg); }));
    tikKlok();
    pasDatumAan();
    pasTegelsAan();
    /* laat bij lokale filmpjes zien of het bestand al op deze computer staat */
    if (bewerk) v.querySelectorAll("[data-kies]").forEach(async k => {
      const t = cfg.tegels[+k.dataset.kies], f = t && t.lokaal && await lokaalBestand(t.lokaal);
      k.textContent = f ? "✓ Wissel" : "📁 Kiezen";
      k.classList.toggle("ok", !!f);
    });
  }
  $("thuisVlak").addEventListener("click", e => {
    if (bewerk) {
      const w = e.target.closest("[data-weg]"); if (w) return vraagWeg(+w.dataset.weg);
      const kz = e.target.closest("[data-kies]");
      if (kz) {
        const i = +kz.dataset.kies, t = cfg.tegels[i];
        /* een lege filmpjestegel (bijv. Vissen) wordt een filmpje van deze computer */
        const id = t.lokaal || "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        return kiesLokaal(id, async () => {
          if (!t.lokaal) {
            try { const vers = await haalVers(); const x = vers.tegels[i]; if (x && x.soort === "video") { x.lokaal = id; x.video = ""; x.blijfAan = true; await bewaar(vers); } } catch (e) {}
          }
          tekenThuis();
        });
      }
      const a = e.target.closest("[data-actie]"); if (!a) return;
      if (a.dataset.actie === "plus") return kiesSoort();
      if (a.dataset.actie === "klaar") return stopBewerken();
      return;
    }
    const b = e.target.closest(".tegel"); if (!b) return;
    const t = (cfg.tegels || [])[+b.dataset.i];
    if (t && SS.compleet(t)) openTegel(t);
  });

  /* ================= tegels aanpassen op het scherm zelf =================
     Medewerkers houden de klok (of de naam bovenaan) 3 seconden ingedrukt, loggen in
     met hetzelfde wachtwoord als de editor, en kunnen dan tegels toevoegen of weghalen.
     Na 3 minuten zonder aanraking stopt dit vanzelf. */
  let bewerk = false, token = "";
  const IDEEEN = [
    { soort: "radio", titel: "Radio 5", zender: "NPO Radio 5", stream: "https://icecast.omroep.nl/radio5-bb-mp3", zenders: [{ naam: "NPO Radio 5", stream: "https://icecast.omroep.nl/radio5-bb-mp3" }], icoon: "radio", kleur: "#fbb900", uitleg: "Muziek van vroeger" },
    { soort: "spellen", titel: "Spelletjes", icoon: "puzzel", kleur: "#f2c7a5", uitleg: "Memory, puzzel en meer" },
    { soort: "journaal", titel: "Journaal", van: 1950, tot: 1970, icoon: "tv", kleur: "#a8cb67", uitleg: "Polygoon-journaals 1950–1970" },
    { soort: "website", titel: "Oude foto's", url: "https://geheugen.delpher.nl", icoon: "foto", kleur: "#bda8bd", uitleg: "Het Geheugen (KB)" },
    { soort: "website", titel: "Puzzelen", url: "https://www.jigidi.com", icoon: "puzzel", kleur: "#a8cb67", uitleg: "Legpuzzels op Jigidi" }
  ];
  const SOORT_NIEUW = [
    { soort: "website", titel: "", url: "https://", icoon: "ster", kleur: "#b8e7f9", naam: "Eigen website", uitleg: "Adres intikken" },
    { soort: "video", titel: "", video: "https://www.youtube.com/watch?v=", icoon: "vis", kleur: "#fbb900", naam: "YouTube", uitleg: "Filmpje of afspeellijst" },
    { soort: "radio", titel: "", zender: "", stream: "https://", icoon: "radio", kleur: "#fbb900", naam: "Radiozender", uitleg: "Adres van de stream" },
    { soort: "video", titel: "", video: "", lokaal: "?", icoon: "vis", kleur: "#b8e7f9", naam: "Filmpje van deze pc", uitleg: "Groot bestand, niet uploaden" }
  ];

  /* lang indrukken op de klok of de kop opent het inloggen */
  let drukT = null;
  $("thuisVlak").addEventListener("pointerdown", e => {
    if (bewerk || VOORBEELD || !e.target.closest(".kop")) return;
    clearTimeout(drukT); drukT = setTimeout(vraagLogin, 3000);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => $("thuisVlak").addEventListener(t, () => clearTimeout(drukT)));

  const laag = () => $("beheerVlak");
  function toonDlg(html) { laag().innerHTML = `<div class="dlg">${html}</div>`; $("beheerLaag").hidden = false; schaal(); return laag().firstElementChild; }
  function sluitDlg() { $("beheerLaag").hidden = true; laag().innerHTML = ""; }

  /* eigen toetsenbord, zodat het ook werkt zonder toetsenbord van Windows */
  function toetsenbord(dlg) {
    const rijen = ["1234567890", "qwertyuiop", "asdfghjkl", "zxcvbnm"];
    const box = document.createElement("div"); box.className = "toetsen";
    box.innerHTML = rijen.map((r, n) => `<div class="r">${n === 3 ? '<button type="button" class="breed" data-t="shift">⇧</button>' : ""}${[...r].map(c => `<button type="button" data-t="${c}">${c}</button>`).join("")}${n === 3 ? '<button type="button" class="breed" data-t="bs">⌫</button>' : ""}</div>`).join("")
      + `<div class="r"><button type="button" class="breed" data-t="https://">https://</button><button type="button" data-t=".">.</button><button type="button" data-t="/">/</button><button type="button" data-t=":">:</button><button type="button" data-t="-">-</button><button type="button" data-t="?">?</button><button type="button" data-t="=">=</button><button type="button" class="spatie" data-t=" ">spatie</button><button type="button" class="breed" data-t=".nl">.nl</button></div>`;
    dlg.appendChild(box);
    let shift = false, doel = dlg.querySelector("input");
    dlg.querySelectorAll("input").forEach(i => { i.setAttribute("inputmode", "none"); i.addEventListener("focus", () => { doel = i; setTimeout(() => { try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) {} }, 0); }); });
    box.addEventListener("pointerdown", e => e.preventDefault());
    box.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b || !doel) return;
      let t = b.dataset.t;
      if (t === "shift") { shift = !shift; b.classList.toggle("aan", shift); box.querySelectorAll("[data-t]").forEach(k => { if (k.dataset.t.length === 1 && /[a-z]/.test(k.dataset.t)) k.textContent = shift ? k.dataset.t.toUpperCase() : k.dataset.t; }); return; }
      const v = doel.value, a = doel.selectionStart == null ? v.length : doel.selectionStart, z = doel.selectionEnd == null ? v.length : doel.selectionEnd;
      if (t === "bs") { const van = a === z ? Math.max(0, a - 1) : a; doel.value = v.slice(0, van) + v.slice(z); doel.setSelectionRange(van, van); }
      else {
        if (shift && t.length === 1) { t = t.toUpperCase(); shift = false; box.querySelector('[data-t="shift"]').click(); shift = false; }
        doel.value = v.slice(0, a) + t + v.slice(z); doel.setSelectionRange(a + t.length, a + t.length);
      }
      doel.dispatchEvent(new Event("input")); doel.focus();
    });
  }

  function vraagLogin() {
    aangeraakt();
    const d = toonDlg(`<h2>Tegels aanpassen</h2><p class="sub">Voor medewerkers. Log in met de gegevens van de schermen-editor.</p>
      <div class="twee" style="grid-template-columns:1fr 1fr"><div><label>Naam (mag leeg bij het gedeelde wachtwoord)</label><input type="text" id="lNaam" autocomplete="off" spellcheck="false"></div>
      <div><label>Wachtwoord</label><input type="password" id="lWw" autocomplete="off"></div></div>
      <div class="knoppen"><div class="fout" id="lFout"></div><button class="knop2" type="button" data-k="stop">Annuleren</button><button class="knop2 geel" type="button" data-k="ok">Inloggen</button></div>`);
    toetsenbord(d);
    d.querySelector("#lNaam").focus();
    d.querySelector('[data-k="stop"]').addEventListener("click", sluitDlg);
    d.querySelector('[data-k="ok"]').addEventListener("click", async () => {
      const naam = d.querySelector("#lNaam").value.trim(), ww = d.querySelector("#lWw").value;
      d.querySelector("#lFout").textContent = "";
      try {
        let tk = ww;
        const r = naam
          ? await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ naam, wachtwoord: ww }) })
          : await fetch("/api/login", { method: "POST", headers: { "x-wachtwoord": ww } });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.fout || "Inloggen lukte niet");
        if (naam) tk = j.token;
        token = tk; sluitDlg(); startBewerken();
      } catch (e) { d.querySelector("#lFout").textContent = e.message; }
    });
  }

  async function haalVers() {
    const r = await fetch(`/api/startscherm/${encodeURIComponent(ID)}`, { cache: "no-store", headers: { "x-wachtwoord": token } });
    const j = await r.json(); if (!r.ok) throw new Error(j.fout || "Fout " + r.status);
    return j;
  }
  async function bewaar(nieuw) {
    const r = await fetch(`/api/startscherm/${encodeURIComponent(ID)}`, { method: "PUT", headers: { "x-wachtwoord": token, "content-type": "application/json" }, body: JSON.stringify(nieuw) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.fout || "Opslaan lukte niet");
    cfg = j; try { localStorage.setItem(opslag, JSON.stringify(j)); } catch (e) {}
    tekenThuis();
  }
  async function startBewerken() {
    try { cfg = await haalVers(); } catch (e) {}
    bewerk = true; tekenThuis();
  }
  function stopBewerken() { bewerk = false; token = ""; sluitDlg(); tekenThuis(); }
  setInterval(() => { if (bewerk && Date.now() - laatsteAanraking > 3 * 60000) stopBewerken(); }, 5000);

  function vraagWeg(i) {
    const t = cfg.tegels[i]; if (!t) return;
    const d = toonDlg(`<h2>Tegel weghalen?</h2><p class="sub">De tegel “${esc(t.titel || "zonder naam")}” verdwijnt van het scherm.</p>
      <div class="fout" id="wFout"></div><div class="knoppen"><button class="knop2" type="button" data-k="nee">Nee, laten staan</button><button class="knop2 zwart" type="button" data-k="ja">Ja, weghalen</button></div>`);
    d.querySelector('[data-k="nee"]').addEventListener("click", sluitDlg);
    d.querySelector('[data-k="ja"]').addEventListener("click", async () => {
      try {
        const vers = await haalVers();
        const n = vers.tegels.findIndex(x => JSON.stringify(x) === JSON.stringify(t));
        vers.tegels.splice(n >= 0 ? n : i, 1);
        await bewaar(vers); sluitDlg();
      } catch (e) { d.querySelector("#wFout").textContent = e.message; }
    });
  }

  function keuzeHtml(x, i, groep) {
    return `<button class="keuze" type="button" data-groep="${groep}" data-i="${i}" style="--c:${x.kleur}"><div class="k">${(SS.ICONEN[x.icoon] || SS.ICONEN.ster).svg}</div><b>${esc(x.naam || x.titel)}</b><small>${esc(x.uitleg || "")}</small></button>`;
  }
  function kiesSoort() {
    lokaalGekozen = false;
    const d = toonDlg(`<h2>Tegel toevoegen</h2><p class="sub">Kies een idee, of maak zelf een tegel. Foto's en eigen filmpjes zet u erbij via de editor op de computer.</p>
      <div class="keuzes">${IDEEEN.map((x, i) => keuzeHtml(x, i, "idee")).join("")}${SOORT_NIEUW.map((x, i) => keuzeHtml(x, i, "nieuw")).join("")}</div>
      <div class="knoppen"><button class="knop2" type="button" data-k="stop">Annuleren</button></div>`);
    d.querySelector('[data-k="stop"]').addEventListener("click", sluitDlg);
    d.querySelectorAll(".keuze").forEach(b => b.addEventListener("click", () => {
      const bron = (b.dataset.groep === "idee" ? IDEEEN : SOORT_NIEUW)[+b.dataset.i];
      const t = JSON.parse(JSON.stringify(bron)); delete t.naam; delete t.uitleg;
      if (t.lokaal) t.lokaal = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      t.foto = ""; t.blijfAan = !["website", "spellen"].includes(t.soort);
      maakTegel(t);
    }));
  }

  /* bestand kiezen op deze computer en naar de opslag van het scherm kopiëren */
  function kiesLokaal(id, klaar) {
    let inp = $("lokaalBestand");
    if (!inp) { inp = document.createElement("input"); inp.type = "file"; inp.id = "lokaalBestand"; inp.accept = "video/*"; inp.hidden = true; document.body.appendChild(inp); }
    inp.value = "";
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      aangeraakt();
      const mb = n => n >= 1e9 ? (n / 1e9).toLocaleString("nl-NL", { maximumFractionDigits: 1 }) + " GB" : Math.round(n / 1e6) + " MB";
      const d = toonDlg(`<h2>Filmpje op deze computer zetten</h2><p class="sub">${esc(f.name)} · ${mb(f.size)}</p>
        <div style="height:40px;border-radius:999px;background:#efeee9;overflow:hidden"><div id="lBalk" style="height:100%;width:0;background:var(--geel);transition:width .3s"></div></div>
        <p class="sub" id="lTekst" style="margin-top:18px">Bezig met kopiëren… Laat het scherm aan staan.</p>
        <div class="knoppen"><div class="fout" id="lFout"></div></div>`);
      try {
        await bewaarLokaal(id, f, p => { aangeraakt(); d.querySelector("#lBalk").style.width = Math.round(p * 100) + "%"; d.querySelector("#lTekst").textContent = `Bezig met kopiëren… ${Math.round(p * 100)}%`; });
        d.querySelector("#lTekst").textContent = "Klaar! Het filmpje staat nu op deze computer.";
        setTimeout(() => { sluitDlg(); if (klaar) klaar(f); }, 1200);
      } catch (e) {
        d.querySelector("#lFout").textContent = "Het kopiëren lukte niet: " + (e && e.message || e);
        d.querySelector(".knoppen").insertAdjacentHTML("beforeend", `<button class="knop2" type="button">Sluiten</button>`);
        d.querySelector(".knoppen button").addEventListener("click", sluitDlg);
      }
    };
    inp.click();
  }

  let lokaalGekozen = false;
  function maakTegel(t) {
    const geenAdres = t.soort === "journaal" || t.soort === "spellen" || !!t.lokaal;
    const veld = t.soort === "website" ? "url" : t.soort === "video" ? "video" : t.soort === "journaal" ? "van" : "stream";
    const labels = { url: "Adres van de website", video: "Link naar YouTube-filmpje of -afspeellijst", stream: "Adres van de radiostream" };
    const d = toonDlg(`<h2>${esc(SS.SOORTEN[t.soort].naam)} toevoegen</h2>
      <div class="twee"><div><label>Naam op de tegel</label><input type="text" id="mNaam" maxlength="18" value="${esc(t.titel)}" autocomplete="off"></div>
      ${t.lokaal ? `<div><label>Filmpje van deze computer</label><button class="knop2" type="button" id="mKies" style="width:100%">📁 Bestand kiezen</button><p id="mGekozen" style="font-size:28px;margin:10px 0 0;opacity:.75">Het filmpje wordt niet geüpload, maar op deze computer bewaard.</p></div>`
        : t.soort === "spellen" ? `<div><label>Spelletjes</label><p style="font-size:30px;margin:12px 0 0;opacity:.75">Memory, legpuzzel, spreekwoorden, zeepbellen, kleurplaat en knopen sorteren</p></div>` : geenAdres ? `<div><label>Jaren</label><div class="twee" style="grid-template-columns:1fr 1fr;gap:16px"><input type="text" id="mVan" value="${esc(t.van)}" maxlength="4" autocomplete="off"><input type="text" id="mTot" value="${esc(t.tot)}" maxlength="4" autocomplete="off"></div></div>`
        : `<div><label>${labels[veld]}</label><input type="text" id="mAdres" value="${esc(t[veld])}" autocomplete="off" spellcheck="false"></div>`}</div>
      <div class="twee ruim"><div><label>Plaatje</label><div class="ikonen">${Object.entries(SS.ICONEN).map(([k, x]) => `<button type="button" data-ic="${k}" class="${k === t.icoon ? "aan" : ""}" aria-label="${esc(x.naam)}">${x.svg}</button>`).join("")}</div></div>
      <div><label>Kleur</label><div class="kleurrij">${SS.KLEUREN.filter(k => k[0] !== "#1e1e1e").map(([hex, n]) => `<button type="button" data-kl="${hex}" class="${hex === t.kleur ? "aan" : ""}" style="background:${hex}" aria-label="${esc(n)}"></button>`).join("")}</div></div></div>
      <div class="knoppen"><div class="fout" id="mFout"></div><button class="knop2" type="button" data-k="terug">Terug</button><button class="knop2 geel" type="button" data-k="ok">Toevoegen</button></div>`);
    d.querySelectorAll("[data-ic]").forEach(b => b.addEventListener("click", () => { t.icoon = b.dataset.ic; d.querySelectorAll("[data-ic]").forEach(x => x.classList.toggle("aan", x === b)); }));
    d.querySelectorAll("[data-kl]").forEach(b => b.addEventListener("click", () => { t.kleur = b.dataset.kl; d.querySelectorAll("[data-kl]").forEach(x => x.classList.toggle("aan", x === b)); }));
    toetsenbord(d);
    const naamV = d.querySelector("#mNaam"), adresV = d.querySelector("#mAdres");
    (t.titel && adresV ? adresV : naamV).focus();
    d.querySelector('[data-k="terug"]').addEventListener("click", kiesSoort);
    if (t.lokaal) d.querySelector("#mKies").addEventListener("click", () => {
      const bewaard = { titel: naamV.value, icoon: t.icoon, kleur: t.kleur };
      kiesLokaal(t.lokaal, f => {
        Object.assign(t, bewaard);
        if (!t.titel.trim()) t.titel = f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 18);
        maakTegel(t);
        const g = $("beheerVlak").querySelector("#mGekozen"); if (g) g.textContent = "✓ " + f.name + " staat op deze computer";
        const k = $("beheerVlak").querySelector("#mKies"); if (k) k.textContent = "📁 Ander bestand kiezen";
        lokaalGekozen = true;
      });
    });
    const ok = d.querySelector('[data-k="ok"]'), fout = d.querySelector("#mFout");
    ok.addEventListener("click", async () => {
      t.titel = naamV.value.trim();
      if (t.lokaal) { if (!lokaalGekozen && !(await lokaalBestand(t.lokaal))) { fout.textContent = "Kies eerst het bestand op deze computer"; return; } }
      else if (t.soort === "spellen") { /* niets in te vullen */ }
      else if (geenAdres) {
        const jv = +d.querySelector("#mVan").value, jt = +d.querySelector("#mTot").value;
        if (!(jv >= 1900 && jv <= 2000 && jt >= 1900 && jt <= 2000)) { fout.textContent = "Vul twee jaartallen in, bijvoorbeeld 1950 en 1970"; return; }
        t.van = Math.min(jv, jt); t.tot = Math.max(jv, jt);
      } else t[veld] = adresV.value.trim();
      if (t.soort === "radio") { if (!t.zender) t.zender = t.titel; t.zenders = [{ naam: t.zender, stream: t.stream }]; }
      if (!SS.compleet(t)) { fout.textContent = SS.ontbreekt(t); return; }
      ok.disabled = true; ok.textContent = "Even geduld…"; fout.textContent = "";
      try {
        if (t.soort === "website") {
          const r = await fetch("/api/insluitbaar?url=" + encodeURIComponent(t.url), { headers: { "x-wachtwoord": token } });
          const j = await r.json().catch(() => ({}));
          if (j.insluitbaar === false) throw new Error("Deze website gaat niet open binnen het scherm. Kies een andere website.");
          if (j.insluitbaar === true) t.insluitbaar = true;
        }
        const vers = await haalVers();
        vers.tegels.push(t);
        await bewaar(vers); sluitDlg();
      } catch (e) { fout.textContent = e.message; ok.disabled = false; ok.textContent = "Toevoegen"; }
    });
  }

  /* ---------- een tegel openen ---------- */
  function openTegel(t) {
    ruimOp(); open = t; modus = "bekijk"; laatsteAanraking = Date.now();
    $("bekijkTitel").textContent = t.titel || "";
    const vak = $("inhoud"); vak.innerHTML = ""; vak.classList.remove("journaal"); vak.style.setProperty("--c", t.kleur || "#fbb900");
    if (t.soort === "website") website(vak, t);
    else if (t.soort === "video") video(vak, t);
    else if (t.soort === "radio") radio(vak, t);
    else if (t.soort === "fotos") fotos(vak, t, true);
    else if (t.soort === "journaal") journaal(vak, t);
    else if (t.soort === "spellen") { const s = window.Spellen.start(vak, t, { esc, ICONEN: SS.ICONEN }); if (s) timers.push({ stop: s }); }
    $("thuis").hidden = true; $("bekijk").hidden = false; tikKlok(); schaal();
  }
  function naarThuis() {
    ruimOp(); open = null; modus = "thuis"; laatsteAanraking = Date.now();
    const vak = $("inhoud");
    vak.querySelectorAll("audio,video").forEach(m => { try { m.pause(); m.removeAttribute("src"); m.load(); } catch (e) {} });
    vak.innerHTML = ""; vak.classList.remove("journaal");
    $("bekijk").hidden = true; $("thuis").hidden = false;
    if (wachtend) { cfg = wachtend; wachtend = null; schaal(); }
    tekenThuis();
  }
  $("terug").addEventListener("click", naarThuis);

  function bericht(vak, kop, tekst, knop) {
    vak.insertAdjacentHTML("beforeend", `<div class="bericht"><b>${esc(kop)}</b>${tekst ? `<p>${esc(tekst)}</p>` : ""}${knop ? `<button class="grootknop" type="button" data-actie="${knop[0]}">${knop[1]}</button>` : ""}</div>`);
    return vak.lastElementChild;
  }

  function website(vak, t) {
    if (t.insluitbaar === false) {
      bericht(vak, "Deze website gaat hier niet open", "De website staat niet toe dat hij binnen een ander scherm wordt getoond. Vraag een medewerker om een andere te kiezen.", ["terug", "Terug naar het begin"])
        .querySelector("button").addEventListener("click", naarThuis);
      return;
    }
    const f = document.createElement("iframe");
    f.className = "site"; f.allow = "autoplay; fullscreen; encrypted-media"; f.referrerPolicy = "strict-origin-when-cross-origin";
    vak.appendChild(f);
    vak.insertAdjacentHTML("beforeend", `<div class="laden">Even geduld…</div>`);
    const laden = vak.querySelector(".laden");
    f.addEventListener("load", () => laden.classList.add("weg"));
    later(() => laden.classList.add("weg"), 12000);
    f.src = t.url;
  }

  /* ===== filmpjes die op de computer bij het scherm staan =====
     Een groot filmpje (bijv. een aquarium van een uur) hoeft niet geüpload te worden:
     een medewerker kiest het bestand één keer op deze computer, het scherm kopieert het
     naar zijn eigen opslag in de browser (Origin Private File System) en speelt het daarvandaan.
     Er gaat niets over internet. Het filmpje staat alleen op deze computer. */
  const LOKAAL_MAP = "filmpjes";
  async function lokaleMap() {
    if (!navigator.storage || !navigator.storage.getDirectory) throw new Error("Deze browser kan geen filmpjes bewaren");
    return (await navigator.storage.getDirectory()).getDirectoryHandle(LOKAAL_MAP, { create: true });
  }
  async function lokaalBestand(id) {
    try { return await (await (await lokaleMap()).getFileHandle(id)).getFile(); } catch (e) { return null; }
  }
  /* bestand kopiëren naar de opslag van deze computer, met voortgang (0..1) */
  async function bewaarLokaal(id, file, voortgang) {
    if (navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) {} }
    if (navigator.storage.estimate) {
      const { quota = 0, usage = 0 } = await navigator.storage.estimate();
      const oud = await lokaalBestand(id);
      if (quota && file.size > quota - usage + (oud ? oud.size : 0)) throw new Error("Er is niet genoeg ruimte op deze computer voor dit filmpje");
    }
    const map = await lokaleMap();
    const tijdelijk = id + ".nieuw";
    const fh = await map.getFileHandle(tijdelijk, { create: true });
    const w = await fh.createWritable();
    let klaar = 0;
    try {
      const lezer = file.stream().getReader();
      for (;;) {
        const { done, value } = await lezer.read();
        if (done) break;
        await w.write(value); klaar += value.byteLength;
        if (voortgang) voortgang(klaar / (file.size || 1));
      }
      await w.close();
    } catch (e) { try { await w.abort(); } catch (x) {} try { await map.removeEntry(tijdelijk); } catch (x) {} throw e; }
    /* het oude filmpje pas weghalen als het nieuwe er helemaal op staat */
    try { await map.removeEntry(id); } catch (e) {}
    if (fh.move) await fh.move(id);
    else {
      const doel = await (await map.getFileHandle(id, { create: true })).createWritable();
      await (await fh.getFile()).stream().pipeTo(doel);
      await map.removeEntry(tijdelijk);
    }
  }
  function lokaalVideo(vak, t) {
    lokaalBestand(t.lokaal).then(f => {
      if (!vak.isConnected) return;
      if (!f) {
        bericht(vak, "Dit filmpje staat nog niet op deze computer", "Een medewerker kan het kiezen: houd de klok 3 seconden ingedrukt, log in en tik op ‘Kiezen’ bij deze tegel.", null);
        return;
      }
      const url = URL.createObjectURL(f);
      timers.push({ stop: () => URL.revokeObjectURL(url) });
      speelEigen(vak, url, startOp(t));
    });
  }

  /* hele afspeellijst op volgorde: speelt alles na elkaar en begint daarna opnieuw */
  function speelLijst(vak, lijst) {
    const f = document.createElement("iframe");
    f.allow = "autoplay; encrypted-media; fullscreen"; f.referrerPolicy = "strict-origin-when-cross-origin";
    f.src = `https://www.youtube-nocookie.com/embed/videoseries?list=${lijst}&autoplay=1&loop=1&rel=0&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&playsinline=1`;
    vak.appendChild(f);
  }
  /* de speler van YouTube één keer inladen */
  let ytBelofte = null;
  function ytApi() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytBelofte) return ytBelofte;
    ytBelofte = new Promise((klaar, mis) => {
      const vorige = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (vorige) vorige(); klaar(); };
      const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api";
      sc.onerror = () => { ytBelofte = null; mis(new Error("YouTube niet bereikbaar")); };
      document.head.appendChild(sc);
      setTimeout(() => mis(new Error("YouTube reageert niet")), 15000);
    });
    return ytBelofte;
  }
  /* een eigen filmpje (geüpload of van deze computer) in een lus afspelen */
  /* filmpjes beginnen standaard op 10 seconden, zodat een intro of reclame aan het begin wegvalt */
  const startOp = t => (t.startOp === undefined || t.startOp === null || t.startOp === "") ? 10 : Math.max(0, +t.startOp || 0);
  function speelEigen(vak, src, start) {
    const v = document.createElement("video");
    v.playsInline = true; v.autoplay = true; v.setAttribute("playsinline", "");
    /* zelf terugspringen naar het beginpunt in plaats van loop (die begint weer bij 0) */
    let begin = start || 0;
    v.addEventListener("loadedmetadata", () => {
      if (begin && v.duration && v.duration < begin + 5) begin = 0;   /* te kort filmpje: gewoon vanaf het begin */
      if (begin) v.currentTime = begin;
    }, { once: true });
    v.addEventListener("ended", () => { v.currentTime = begin; v.play().catch(() => {}); });
    v.src = src;
    vak.appendChild(v);
    const probeer = () => v.play().catch(() => {
      if (vak.querySelector(".bericht")) return;
      const b = bericht(vak, "", "", ["speel", SPEEL.replace("<svg", '<svg style="width:56px;height:56px"') + "Afspelen"]);
      b.style.background = "rgba(0,0,0,.35)";
      b.querySelector("button").addEventListener("click", () => { b.remove(); v.play().catch(() => {}); });
    });
    v.addEventListener("error", () => bericht(vak, "Dit filmpje speelt nu niet", "Probeer het later nog eens.", null));
    probeer();
  }
  function video(vak, t) {
    if (t.lokaal) { lokaalVideo(vak, t); return; }
    const lijst = SS.youtubeLijst(t.video);
    if (lijst) {
      /* afspeellijst via de speler van YouTube: geschud (standaard) of op volgorde, met een knop voor het volgende nummer */
      const schudden = t.willekeurig !== false;
      const plek = document.createElement("div"); vak.appendChild(plek);
      ytApi().then(() => {
        if (!plek.isConnected) return;
        let n = 0;
        const p = new YT.Player(plek, {
          host: "https://www.youtube-nocookie.com", width: "100%", height: "100%",
          playerVars: { listType: "playlist", list: lijst, autoplay: 1, rel: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1 },
          events: {
            onReady: () => {
              const begin = () => {
                try {
                  const l = p.getPlaylist();
                  if (l && l.length) {
                    p.setLoop(true);
                    if (schudden) { p.setShuffle(true); p.playVideoAt(Math.floor(Math.random() * l.length)); } else p.playVideo();
                  } else if (n++ < 30) later(begin, 300);
                  else p.playVideo();
                } catch (e) {}
              };
              begin();
              vak.insertAdjacentHTML("beforeend", `<button class="volgendknop" type="button">Volgend nummer ${PIJL_R.replace('stroke="#1e1e1e"', 'stroke="currentColor"')}</button>`);
              const knop = vak.querySelector(".volgendknop");
              knop.addEventListener("click", () => {
                try { p.nextVideo(); } catch (e) {}
                knop.classList.add("tik"); later(() => knop.classList.remove("tik"), 400);
              });
            }
          }
        });
      }).catch(() => { if (plek.isConnected) { plek.remove(); speelLijst(vak, lijst); } });
      return;
    }
    const yt = SS.youtubeId(t.video);
    if (yt && startOp(t)) {
      /* via de YouTube-speler, zodat hij bij elke herhaling weer op het beginpunt start */
      const plek = document.createElement("div"); vak.appendChild(plek);
      const st = startOp(t);
      ytApi().then(() => {
        if (!plek.isConnected) return;
        const p = new YT.Player(plek, {
          host: "https://www.youtube-nocookie.com", width: "100%", height: "100%", videoId: yt,
          playerVars: { autoplay: 1, start: st, rel: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1 },
          events: { onStateChange: e => { if (e.data === YT.PlayerState.ENDED) { p.seekTo(st, true); p.playVideo(); } } }
        });
      }).catch(() => {
        if (!plek.isConnected) return;
        plek.remove();
        const f = document.createElement("iframe"); f.allow = "autoplay; encrypted-media; fullscreen";
        f.src = `https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&loop=1&playlist=${yt}&rel=0&controls=0&start=${st}&playsinline=1`;
        vak.appendChild(f);
      });
      return;
    }
    if (yt) {
      const f = document.createElement("iframe");
      f.allow = "autoplay; encrypted-media; fullscreen"; f.referrerPolicy = "strict-origin-when-cross-origin";
      const st = startOp(t);
      f.src = `https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&loop=1&playlist=${yt}&rel=0&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&playsinline=1${st ? "&start=" + st : ""}`;
      vak.appendChild(f);
      return;
    }
    speelEigen(vak, t.video, startOp(t));
  }

  /* oude journaals van Open Beelden: als een tv-zender, het ene filmpje na het andere */
  function journaal(vak, t) {
    vak.classList.add("journaal");
    const laden = document.createElement("div"); laden.className = "laden"; laden.textContent = "Even geduld, de journaals worden opgehaald…"; vak.appendChild(laden);
    const van = +t.van || 1950, tot = +t.tot || 1970;
    /* eerst Wikimedia Commons; lukt dat niet, dan de lijst die de site zelf bij Open Beelden ophaalt */
    const viaSite = () => fetch(`/api/openbeelden?van=${van}&tot=${tot}&aantal=80`).then(r => r.json()).then(d => (d && d.items) || []).catch(() => []);
    SS.journaals(van, tot, 60).catch(() => []).then(l => l.length ? l : viaSite()).then(items => {
      if (!vak.isConnected) return;
      const lijst = (items || []).filter(x => x && x.v);
      laden.remove();
      if (!lijst.length) { bericht(vak, "De journaals zijn nu niet te vinden", "Probeer het later nog eens, of kies in de instellingen andere jaren.", null); return; }
      const v = document.createElement("video"); v.playsInline = true; v.setAttribute("playsinline", ""); v.autoplay = true; v.preload = "auto";
      vak.appendChild(v);
      vak.insertAdjacentHTML("beforeend", `<div class="over"><b></b><span></span></div><div class="bron">Polygoon / Beeld en Geluid · Open Beelden, via Wikimedia Commons (CC BY-SA)</div><button class="pijl r volgende" type="button" aria-label="Volgende journaal">${PIJL_R}</button>`);
      const over = vak.querySelector(".over");
      let i = -1, fouten = 0, verbergT = null;
      const speel = () => {
        i = (i + 1) % lijst.length;
        const x = lijst[i];
        over.querySelector("b").textContent = x.t;
        over.querySelector("span").textContent = [x.p, x.j ? "Polygoon-journaal " + x.j : ""].filter(Boolean).join(", ");
        over.classList.remove("weg"); clearTimeout(verbergT); verbergT = later(() => over.classList.add("weg"), 9000);
        v.src = x.v;
        v.play().catch(() => {
          if (vak.querySelector(".bericht")) return;
          const b = bericht(vak, "", "", ["speel", SPEEL.replace("<svg", '<svg style="width:56px;height:56px"') + "Afspelen"]);
          b.style.background = "rgba(0,0,0,.35)";
          b.querySelector("button").addEventListener("click", () => { b.remove(); v.play().catch(() => {}); });
        });
      };
      v.addEventListener("ended", speel);
      v.addEventListener("playing", () => { fouten = 0; });
      v.addEventListener("error", () => {
        if (!v.getAttribute("src")) return;
        if (++fouten >= 6) { v.removeAttribute("src"); bericht(vak, "De journaals spelen nu niet", "Open Beelden is misschien even niet bereikbaar. Probeer het later nog eens.", null); return; }
        speel();
      });
      vak.querySelector(".volgende").addEventListener("click", speel);
      speel();
    }).catch(() => {
      if (!vak.isConnected) return;
      laden.remove();
      bericht(vak, "De journaals zijn nu niet te bereiken", "Probeer het later nog eens.", null);
    });
  }

  /* fotoalbum; ook gebruikt als achtergrond bij de radio (dan zonder pijlen) */
  function fotos(vak, t, metPijlen) {
    const lijst = (t.fotos || []).filter(f => f && f.src);
    if (!lijst.length) return false;
    /* willekeurige volgorde (standaard): schudden, zodat elke keer een andere foto begint */
    if (t.willekeurig !== false) for (let a = lijst.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [lijst[a], lijst[b]] = [lijst[b], lijst[a]]; }
    let i = 0, huidige = null, volgendeT = null;
    const sec = Math.max(5, +t.seconden || 12) * 1000;
    const toon = n => {
      i = (n + lijst.length) % lijst.length;
      const f = lijst[i], el = document.createElement("div");
      el.className = "dia";
      el.innerHTML = `<div class="vaag" style="background-image:url('${esc(f.src)}')"></div><img src="${esc(f.src)}" alt="">${metPijlen && f.tekst ? `<div class="ondertitel">${esc(f.tekst)}</div>` : ""}`;
      vak.insertBefore(el, vak.querySelector(".pijl, .paneel") || null);
      const img = el.querySelector("img");
      const wissel = () => {
        requestAnimationFrame(() => el.classList.add("aan"));
        const oud = huidige; huidige = el;
        if (oud) setTimeout(() => oud.remove(), 1700);
      };
      img.decode ? img.decode().then(wissel, wissel) : wissel();
      clearTimeout(volgendeT);
      if (lijst.length > 1) { volgendeT = later(() => toon(i + 1), sec); }
    };
    if (metPijlen && lijst.length > 1) {
      vak.insertAdjacentHTML("beforeend", `<button class="pijl l" type="button" aria-label="Vorige foto">${PIJL_L}</button><button class="pijl r" type="button" aria-label="Volgende foto">${PIJL_R}</button>`);
      vak.querySelector(".pijl.l").addEventListener("click", () => toon(i - 1));
      vak.querySelector(".pijl.r").addEventListener("click", () => toon(i + 1));
    }
    toon(0);
    return true;
  }

  function radio(vak, t) {
    const zenders = SS.zendersVan(t);
    const box = document.createElement("div"); box.className = "radio"; vak.appendChild(box);
    if (!fotos(box, t, false)) box.insertAdjacentHTML("beforeend", `<div class="achter">${(SS.ICONEN[t.icoon] || SS.ICONEN.radio).svg}</div>`);
    /* meerdere zenders: grote knoppen om te wisselen */
    if (zenders.length > 1) box.insertAdjacentHTML("beforeend", `<div class="zenders">${zenders.map((z, i) => `<button type="button" data-z="${i}">${esc(z.naam)}</button>`).join("")}</div>`);
    box.insertAdjacentHTML("beforeend", `<div class="paneel"><div class="info"><b data-naam></b><span data-status>Bezig met afstemmen…</span></div>
      <button class="rond hoofd" type="button" data-knop="speel" aria-label="Aan of uit">${PAUZE}</button>
      <div class="volume"><button class="rond" type="button" data-knop="zachter" aria-label="Zachter">${MIN}</button><button class="rond" type="button" data-knop="harder" aria-label="Harder">${PLUS}</button></div></div>`);
    const a = new Audio(); a.preload = "none";
    const sleutel = "ss-volume-" + ID, zKey = "ss-zender-" + ID + "-" + (t.titel || "");
    let vol = 0.7; try { vol = Math.min(1, Math.max(0.1, +localStorage.getItem(sleutel) || 0.7)); } catch (e) {}
    a.volume = vol;
    box.appendChild(a);
    let nr = 0; try { nr = Math.min(zenders.length - 1, Math.max(0, +localStorage.getItem(zKey) || 0)); } catch (e) {}
    const status = box.querySelector("[data-status]"), speel = box.querySelector('[data-knop="speel"]'), naam = box.querySelector("[data-naam]");
    const toonVol = () => { status.textContent = "Volume " + Math.round(a.volume * 10) + " van 10"; later(() => { if (!a.paused) status.textContent = "Speelt nu"; }, 2000); };
    const zet = aan => { speel.innerHTML = aan ? PAUZE : SPEEL; };
    a.addEventListener("playing", () => { status.textContent = "Speelt nu"; zet(true); });
    let mislukt = false;
    a.addEventListener("pause", () => { if (!mislukt) status.textContent = "Staat op pauze"; zet(false); });
    a.addEventListener("waiting", () => { status.textContent = "Even geduld…"; });
    a.addEventListener("error", () => { if (!a.getAttribute("src")) return; mislukt = true; status.textContent = "Deze zender is nu niet te bereiken"; zet(false); });
    const start = () => {
      mislukt = false;
      const z = zenders[nr];
      naam.textContent = z.naam; status.textContent = "Bezig met afstemmen…";
      box.querySelectorAll("[data-z]").forEach(b => b.classList.toggle("aan", +b.dataset.z === nr));
      a.src = z.stream;
      a.play().catch(() => { if (!mislukt) status.textContent = "Tik op de gele knop om te luisteren"; zet(false); });
    };
    box.querySelectorAll("[data-z]").forEach(b => b.addEventListener("click", () => {
      nr = +b.dataset.z; try { localStorage.setItem(zKey, nr); } catch (e) {}
      start();
    }));
    speel.addEventListener("click", () => { if (a.paused) start(); else { a.pause(); a.removeAttribute("src"); a.load(); zet(false); status.textContent = "Staat uit"; } });
    box.querySelector('[data-knop="zachter"]').addEventListener("click", () => { a.volume = Math.max(0.1, Math.round((a.volume - 0.1) * 10) / 10); try { localStorage.setItem(sleutel, a.volume); } catch (e) {} toonVol(); });
    box.querySelector('[data-knop="harder"]').addEventListener("click", () => { a.volume = Math.min(1, Math.round((a.volume + 0.1) * 10) / 10); try { localStorage.setItem(sleutel, a.volume); } catch (e) {} toonVol(); });
    start();
  }

  /* ---------- terug naar de tegels na een tijd zonder aanraking ---------- */
  function aangeraakt() { laatsteAanraking = Date.now(); }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(t => addEventListener(t, aangeraakt, { passive: true, capture: true }));
  /* een aanraking in een website binnen het scherm zien we niet; als het iframe de focus krijgt, telt dat ook */
  addEventListener("blur", () => setTimeout(() => { if (document.activeElement && document.activeElement.tagName === "IFRAME") aangeraakt(); }, 0));
  setInterval(() => {
    if (modus !== "bekijk" || !open || open.blijfAan || !cfg) return;
    const wacht = Math.max(1, +((cfg.start || {}).terugNa) || 5) * 60000;
    if (Date.now() - laatsteAanraking > wacht) naarThuis();
  }, 5000);

  /* muispijl weg als hij stilstaat; geen rechtermuis- of lang-drukken-menu */
  let muisT = null;
  addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; document.body.classList.remove("geenmuis"); clearTimeout(muisT); muisT = setTimeout(() => document.body.classList.add("geenmuis"), 3000); });
  if (!VOORBEELD) document.body.classList.add("geenmuis");
  addEventListener("contextmenu", e => e.preventDefault());

  /* ---------- laden en bijwerken ---------- */
  let wachtend = null;
  function teken(nieuw) {
    /* staat er iets open, dan pas bijwerken als iemand terug is bij de tegels */
    if (cfg && modus === "bekijk" && !VOORBEELD) { wachtend = nieuw; return; }
    cfg = nieuw; schaal();
    if (modus === "bekijk") naarThuis(); else tekenThuis();
  }
  function melding(t) { document.body.insertAdjacentHTML("beforeend", `<div class="melding"><div>${esc(t)}</div></div>`); }

  const opslag = "ss-start-" + ID;
  async function controleer() {
    try {
      const r = await fetch(`/api/startscherm/${encodeURIComponent(ID)}`, { cache: "no-store" });
      const d = await r.json();
      if (!r.ok) throw new Error(d.fout || "Fout " + r.status);
      try { localStorage.setItem(opslag, JSON.stringify(d)); } catch (e) {}
      document.querySelectorAll(".melding").forEach(m => m.remove());
      if (bewerk) return;
      if (!cfg || cfg.bijgewerkt !== d.bijgewerkt) teken(d);
    } catch (e) {
      if (!cfg) {
        let bewaard = null; try { bewaard = JSON.parse(localStorage.getItem(opslag)); } catch (x) {}
        if (bewaard) teken(bewaard);
        else if (!document.querySelector(".melding")) melding(/bestaat niet/.test(e.message) ? `Startscherm "${ID}" bestaat (nog) niet. Maak het aan in de instellingen.` : "Geen verbinding met internet. Het scherm probeert het over een minuut opnieuw.");
      }
    }
  }

  if (VOORBEELD) {
    addEventListener("message", e => {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === "start") { cfg = e.data.start; schaal(); if (modus === "bekijk") naarThuis(); else tekenThuis(); }
    });
    parent.postMessage({ type: "klaar" }, location.origin);
  } else if (!ID) {
    melding("Geen startscherm gekozen. Gebruik het adres uit de instellingen, bijvoorbeeld /t/isselwaerde.");
  } else {
    controleer(); setInterval(controleer, 60000);
    /* nieuwe versie van de site: herladen zodra het scherm weer bij de tegels staat */
    let versie = null, herladen = false;
    setInterval(async () => {
      try {
        const v = (await (await fetch("/api/versie", { cache: "no-store" })).json()).versie;
        if (!v) return; if (versie === null) versie = v; else if (v !== versie) herladen = true;
      } catch (e) {}
    }, 5 * 60000);
    setInterval(() => { if (herladen && modus === "thuis" && Date.now() - laatsteAanraking > 30000) location.reload(); }, 5000);
  }
  schaal();
})();
</script>
</body></html>
